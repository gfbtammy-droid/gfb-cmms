function invForm(id){const p=S.purchases[id];const inv=p.inv||{};
  const fields=[{k:'invNo',label:'Supplier invoice no.'},{k:'invDate',label:'Invoice date',type:'date'},{k:'invAmount',label:'Invoice amount (RM)',type:'number'},
    {k:'sapRef',label:'SAP B1 reference no.',ph:'e.g. A/P invoice or GRPO document no.'},{k:'sapNote',label:'Note',full:true}];
  formSheet({title:'Invoice & SAP B1 reference · '+(p.poNo||p.no),fields,data:inv,
    extra:`<p class="muted" style="margin:0">The invoice itself is keyed into SAP B1. Record the SAP B1 document number here so this purchase can be traced from the CMMS to accounts.${num(inv.invAmount)||1?'':''}</p>`,
    onSave:async v=>{const next={...p,inv:{...inv,...v,invAmount:v.invAmount===''?'':num(v.invAmount)}};
      const warn=v.invAmount!==''&&Math.abs(num(v.invAmount)-purGrand(p))>0.009?` (invoice ${rm(v.invAmount)} differs from PO ${rm(purGrand(p))})`:'';
      try{await put('purchases',id,next,'Invoice / SAP B1 reference: '+[v.invNo&&'inv '+v.invNo,v.sapRef&&'SAP '+v.sapRef].filter(Boolean).join(', ')+warn)}catch(e){return e.message}
      toast('Saved'+warn);renderList();renderDetail()}});
}
function purCancel(id){const p=S.purchases[id];
  formSheet({title:'Cancel '+(p.poNo||p.no),fields:[{k:'reason',label:'Reason',type:'textarea',full:true,req:true}],data:{},saveLabel:'Cancel request',
    onSave:async v=>{try{await put('purchases',id,{...p,status:'Cancelled',cancelReason:v.reason},'Cancelled: '+v.reason)}catch(e){return e.message}toast('Cancelled');renderList();renderDetail()}});
}

/* detail */
DETAIL.purchase=(id,p)=>{
  const ap=p.approval||null,po=p.po||{},inv=p.inv||{},wo=p.woId&&S.workorders[p.woId];
  const st=p.status||'Draft';
  let banner='';
  if(st==='Pending approval')banner=isApprover()?`<div class="banner" style="margin:0;background:var(--warn-soft)"><b>Waiting for your approval.</b> ${rm(purLinesTotal(p))} for ${(p.lines||[]).length} item(s).</div>`:`<div class="banner" style="margin:0;background:var(--warn-soft)"><b>Waiting for approval.</b> An approver will approve or reject this request.</div>`;
  if(st==='Rejected')banner=`<div class="banner" style="margin:0;background:var(--bad-soft)"><b>Rejected</b> by ${esc(ap&&ap.name||'')}${ap&&ap.note?': '+esc(ap.note):''}. Revise and resubmit, or cancel.</div>`;
  if(st==='Approved')banner=`<div class="banner" style="margin:0"><b>Approved.</b> Next: create the purchase order.</div>`;
  if(purSapMissing(p))banner=`<div class="banner" style="margin:0;background:var(--warn-soft)"><b>SAP B1 reference missing.</b> Once the supplier invoice is keyed into SAP B1, record its reference number here.</div>`;
  if(st==='Cancelled')banner=`<div class="banner" style="margin:0">Cancelled${p.cancelReason?': '+esc(p.cancelReason):''}.</div>`;
  const btn=[];
  if(S.canWrite){
    if(st==='Pending approval'&&isApprover())btn.push('<button class="btn pri" id="pApprove">Approve</button><button class="btn" id="pReject">Reject</button>');
    if(['Draft','Pending approval','Rejected','Approved'].includes(st))btn.push(`<button class="btn${st==='Draft'||st==='Rejected'?' pri':''}" id="pEdit">${st==='Draft'?'Continue draft':st==='Rejected'?'Revise &amp; resubmit':'Edit request'}</button>`);
    if(st==='Approved')btn.push('<button class="btn pri" id="pPO">Create purchase order</button>');
    if(purOpen(p))btn.push('<button class="btn pri" id="pRecv">Receive goods</button>');
    if(['PO issued','Partly received','Received'].includes(st))btn.push('<button class="btn" id="pInv">Invoice &amp; SAP B1 ref</button>');
  }
  if(p.poNo)btn.push('<button class="btn" id="pPrint">Print PO</button><button class="btn" id="pDl">Download PO</button>');
  if(S.canWrite&&p.poNo&&purOpen(p))btn.push('<button class="btn" id="pPOe">Edit PO details</button>');
  if(S.canWrite&&!['Received','Cancelled'].includes(st))btn.push('<button class="btn" id="pCancel">Cancel</button>');
  const lines=p.lines||[];const showRecv=(p.receipts||[]).length||purOpen(p);
  return{eyebrow:'Purchase · '+esc(p.no||'Draft')+(p.poNo?' · '+esc(p.poNo):''),title:String(p.purpose||'Purchase request').split('\n')[0].slice(0,120),
    pills:purPill(p)+`<span class="pill">${rm(purGrand(p))}</span>`+(purSapMissing(p)?'<span class="pill warn">SAP ref missing</span>':''),
    body:`${banner}<div class="acts">${btn.join('')}</div>
    ${kv([['PR no.',p.no?`<span class="mono">${esc(p.no)}</span>`:''],['Requested by',esc(p.requestedBy)],['Department',esc(p.dept)],['Request date',fmtD(p.reqDate)],['Needed by',fmtD(p.neededBy)],['For work order',wo?`<a href="#" data-wo="${p.woId}">${esc(wo.no)}</a> · ${esc(woWhat(wo))}`:''],['Suggested supplier',esc(sup(p.supplierId)?.name||'')]])}
    ${p.purpose?`<div><h3>Purpose / reason</h3><div style="white-space:pre-wrap">${esc(p.purpose)}</div></div>`:''}
    <div><h3>Items</h3><div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Item</th><th class="r">Qty</th>${showRecv?'<th class="r">Received</th><th class="r">Outstanding</th>':''}<th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>${lines.map(l=>{const g=purRecv(p,l.lid);return`<tr><td>${l.partId&&S.parts[l.partId]?`<a href="#" data-part="${l.partId}">${esc(l.desc)}</a>`:esc(l.desc)}</td><td class="r num">${esc(l.qty)} ${esc(l.unit||'')}</td>${showRecv?`<td class="r num">${g}</td><td class="r num">${Math.max(0,num(l.qty)-g)}</td>`:''}<td class="r num">${l.price!==''&&l.price!=null?rm(l.price):'—'}</td><td class="r num">${rm(num(l.qty)*num(l.price))}</td></tr>`}).join('')||emptyRow(6,'No items','')}</tbody></table></div>
      <p style="margin:6px 0 0;text-align:right">Items ${rm(purLinesTotal(p))}${num(po.other)?` · ${esc(po.otherLabel||'Other charges')} ${rm(po.other)}`:''} · <b>Total ${rm(purGrand(p))}</b></p></div>
    <div><h3>Approval</h3>${ap?kv([['Decision',`<span class="pill ${ap.decision==='Approved'?'ok':'bad'}">${esc(ap.decision)}</span>`],['By',esc(ap.name||'')],['Date &amp; time',ap.at?fmtDT(ap.at):''],['Approved amount',ap.decision==='Approved'?rm(ap.total):''],['Note',esc(ap.note||'')]]):`<p class="muted" style="margin:0">${st==='Draft'?'Not submitted yet.':'No decision yet.'}</p>`}</div>
    ${p.poNo?`<div><h3>Purchase order</h3>${kv([['PO no.',`<span class="mono">${esc(p.poNo)}</span>`],['PO date',fmtD(po.date)],['Supplier',po.supplierId&&sup(po.supplierId)?`<a href="#" data-sup="${po.supplierId}">${esc(sup(po.supplierId).name)}</a>`:''],['Delivery date',esc(po.delivery&&/^\d{4}-\d\d-\d\d$/.test(po.delivery)?fmtD(po.delivery):po.delivery||'')],['Payment terms',esc(po.terms)],['Quotation ref.',esc(po.quoteRef)],['Deliver to',esc(po.deliverTo)]])}</div>`:''}
    ${(p.receipts||[]).length?`<div><h3>Goods received</h3><div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Date</th><th>DO no.</th><th>Items</th><th class="hs">Received by</th></tr></thead><tbody>${p.receipts.map(r=>`<tr><td class="num">${fmtD(r.date)}</td><td class="mono">${esc(r.doNo||'')}</td><td>${(r.lines||[]).map(x=>{const l=lines.find(y=>y.lid===x.lid);return esc((l?l.desc:'item')+' × '+x.qty)}).join('<br>')}${r.note?'<br><span class="muted">'+esc(r.note)+'</span>':''}</td><td class="hs">${who(r)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    ${p.poNo?`<div><h3>Invoice &amp; SAP B1</h3>${kv([['Supplier invoice no.',esc(inv.invNo)],['Invoice date',fmtD(inv.invDate)],['Invoice amount',inv.invAmount!==''&&inv.invAmount!=null?rm(inv.invAmount)+(Math.abs(num(inv.invAmount)-purGrand(p))>0.009?' <span class="pill warn">differs from PO</span>':''):''],['SAP B1 reference no.',inv.sapRef?`<span class="mono">${esc(inv.sapRef)}</span>`:''],['Note',esc(inv.sapNote)]])}</div>`:''}`,
    bind(d){const on=(s,f)=>{const b=$(s,d);if(b)b.onclick=f};
      on('#pApprove',()=>purDecide(id,'Approved'));on('#pReject',()=>purDecide(id,'Rejected'));on('#pEdit',()=>purForm(id));on('#pPO',()=>poForm(id));on('#pPOe',()=>poForm(id));
      on('#pRecv',()=>recvForm(id));on('#pInv',()=>invForm(id));on('#pPrint',()=>poPrint(id,true));on('#pDl',()=>poPrint(id,false));on('#pCancel',()=>purCancel(id));
      $$('[data-wo]',d).forEach(x=>x.onclick=ev=>{ev.preventDefault();openDetail('wo',x.dataset.wo)});
      $$('[data-part]',d).forEach(x=>x.onclick=ev=>{ev.preventDefault();openDetail('part',x.dataset.part)});
      $$('[data-sup]',d).forEach(x=>x.onclick=ev=>{ev.preventDefault();openDetail('supplier',x.dataset.sup)})}};
};

/* list */
function filteredPurchases(){const q=fval('purchases','q'),s=fval('purchases','state');
  return Object.entries(S.purchases).filter(([,p])=>{const st=p.status||'Draft';
    const ok=!s?!['Received','Cancelled','Rejected'].includes(st)||purSapMissing(p):s==='pending'?st==='Pending approval':s==='approved'?st==='Approved':s==='order'?purOpen(p):s==='sap'?purSapMissing(p):s==='received'?st==='Received':s==='rejected'?st==='Rejected'||st==='Cancelled':s==='draft'?st==='Draft':true;
    return ok&&match(q,p.no,p.poNo,p.purpose,p.requestedBy,p.dept,sup(p.supplierId)?.name,sup(p.po&&p.po.supplierId)?.name,p.inv&&p.inv.sapRef,p.inv&&p.inv.invNo,...(p.lines||[]).map(l=>l.desc))})
    .sort((a,b)=>String(b[1].reqDate||'').localeCompare(String(a[1].reqDate||''))||String(b[1].no||'').localeCompare(String(a[1].no||'')))}
VIEW.purchases={
  shell:()=>`<h2>Purchasing</h2><p class="muted" style="margin-top:-4px">Purchase request → approval → purchase order → goods received. Supplier invoices are keyed into SAP B1; record the SAP B1 reference on each purchase.</p><div class="toolbar">
    <input class="grow" type="search" data-f="q" id="q_u" placeholder="Search PR / PO no., item, supplier, SAP ref…" value="${esc(fval('purchases','q'))}">
    <select data-f="state" id="s_u" style="width:auto">${[['','Open (not closed)'],['pending','Waiting for approval'],['approved','Approved, PO not issued'],['order','On order (PO issued)'],['sap','Received, SAP ref missing'],['received','Received'],['draft','Drafts'],['rejected','Rejected / cancelled'],['all','Everything']].map(o=>opt(o,fval('purchases','state'))).join('')}</select>
    ${W(()=>'<button class="btn pri" id="addU">New purchase request</button>')}<button class="btn" id="expU">Export CSV</button></div><div id="list"></div>`,
  bind(){bindFilters('purchases');const a=$('#addU');if(a)a.onclick=()=>purForm();$('#expU').onclick=()=>exportCSV('purchases')},
  list(){const rows=filteredPurchases();const all=Object.values(S.purchases);
    return`<p class="muted" style="margin:0 0 8px">${all.filter(p=>p.status==='Pending approval').length} waiting for approval · ${all.filter(p=>p.status==='Approved').length} approved, PO not issued · ${all.filter(purOpen).length} on order · ${all.filter(purSapMissing).length} received without SAP ref</p>
    <div class="tbl-wrap"><table><thead><tr><th>PR · PO</th><th>Items · purpose</th><th class="hs">Supplier</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(([id,p])=>`<tr data-open="purchase:${id}"><td class="mono">${esc(p.no||'Draft')}${p.poNo?'<br>'+esc(p.poNo):''}<br><span class="muted" style="font-family:var(--f-body)">${fmtD(p.reqDate)}</span></td><td>${purItemsText(p)}<br><span class="muted">${esc(String(p.purpose||'').split('\n')[0].slice(0,90))}</span><br><span class="muted">${esc(p.requestedBy||'')}${p.dept?' · '+esc(p.dept):''}</span></td><td class="hs">${esc(sup((p.po&&p.po.supplierId)||p.supplierId)?.name||'—')}</td><td class="r num">${rm(purGrand(p))}</td><td>${purPill(p)}${purSapMissing(p)?'<br><span class="pill warn">SAP ref missing</span>':''}${p.neededBy&&!['Received','Cancelled','Rejected'].includes(p.status)?`<br><span class="muted">Needed ${fmtD(p.neededBy)}</span>`:''}</td></tr>`).join(''):emptyRow(5,'No purchases here','Use New purchase request to start one.')}</tbody></table></div>`}
};

function routeHash(){const m=location.hash.match(/^#asset-([A-Za-z0-9_\-]+)$/);if(m&&S.assets[m[1]]){openDetail('asset',m[1]);history.replaceState(null,'',location.pathname)}else{const v=location.hash.slice(1);if(ALLVIEWS.some(x=>x[0]===v))go(v)}}
window.addEventListener('hashchange',routeHash);

/* ---------- sign-in ---------- */
function authCard(inner){closeLayer('sheet');closeLayer('drawer');$('#tabs').innerHTML='';$('#me').innerHTML='';$('#main').innerHTML=`<div class="login">${inner}</div>`}
function showLogin(mode){
  mode=mode||'signin';
  const f=(id,label,type,ac)=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" autocomplete="${ac}"${type==='email'?' autocapitalize="none" spellcheck="false"':''}></div>`;
  const body={signin:`<h2>Sign in</h2>${f('l_user','Email','email','username')}${f('l_pass','Password','password','current-password')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Sign in</button>
      <p class="muted" style="margin:0;font-size:13px"><a href="#" data-m="signup">Request access</a> · <a href="#" data-m="forgot">Forgot password</a></p>`,
    signup:`<h2>Request access</h2><p class="muted" style="margin:0">Create your account. An admin approves it before you can see records. The very first account becomes the admin.</p>${f('l_name','Full name','text','name')}${f('l_user','Work email','email','username')}${f('l_pass','Password (8+ characters)','password','new-password')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Create account</button><p class="muted" style="margin:0;font-size:13px"><a href="#" data-m="signin">Back to sign in</a></p>`,
    forgot:`<h2>Reset password</h2><p class="muted" style="margin:0">We'll email you a link to set a new password.</p>${f('l_user','Email','email','username')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Send reset link</button><p class="muted" style="margin:0;font-size:13px"><a href="#" data-m="signin">Back to sign in</a></p>`,
    newpw:`<h2>Set a new password</h2>${f('l_pass','New password (8+ characters)','password','new-password')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Save password</button>`}[mode];
  authCard(`<form id="lf" novalidate style="display:flex;flex-direction:column;gap:14px">${body}</form>`);
  $$('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();showLogin(a.dataset.m)});
  $('#lf').onsubmit=async e=>{e.preventDefault();const er=$('#lerr');er.hidden=true;const v=id=>($('#'+id)||{}).value||'';
    try{
      if(mode==='signin'){await api('POST','/api/login',{username:v('l_user'),password:v('l_pass')});start()}
      else if(mode==='signup'){if(!v('l_name').trim())throw ERR('Enter your full name.',400);const r=await api('POST','/api/signup',{name:v('l_name'),email:v('l_user'),password:v('l_pass')});
        if(r.session)start();else authCard(`<h2>Check your email</h2><p style="margin:0">Open the confirmation link sent to <b>${esc(v('l_user'))}</b>, then come back and sign in. An admin then approves your access.</p><button class="btn" id="back">Back to sign in</button>`),$('#back').onclick=()=>showLogin()}
      else if(mode==='forgot'){await api('POST','/api/forgot',{email:v('l_user')});authCard(`<h2>Check your email</h2><p style="margin:0">If <b>${esc(v('l_user'))}</b> has an account, a reset link is on its way.</p><button class="btn" id="back">Back to sign in</button>`);$('#back').onclick=()=>showLogin()}
      else if(mode==='newpw'){await api('POST','/api/password',{next:v('l_pass')});history.replaceState(null,'',location.pathname);toast('Password saved');start()}
    }catch(x){er.textContent=x.message;er.hidden=false}};
  const first=$('#lf input');if(first)first.focus();
}
function renderMe(){
  const me=S.me;const ini=me.name.split(/\s+/).map(s=>s[0]).join('').slice(0,2).toUpperCase();
  $('#me').innerHTML=`<button type="button" id="meb" aria-haspopup="true"><span class="av">${esc(ini)}</span><span>${esc(me.name)}</span></button><div class="pop" id="mep" hidden><div class="muted" style="padding:6px 10px;font-size:12px">${esc(me.username)} · ${esc(me.role)}</div><a class="pop-a" href="guide.html" target="_blank" rel="noopener">User guide</a><button type="button" id="mpw">Change password</button><button type="button" id="mout">Sign out</button></div>`;
  $('#meb').onclick=e=>{e.stopPropagation();$('#mep').hidden=!$('#mep').hidden};
  document.addEventListener('click',()=>{const p=$('#mep');if(p)p.hidden=true});
  $('#mout').onclick=async()=>{await api('POST','/api/logout');location.reload()};
  $('#mpw').onclick=()=>{const fields=[{k:'current',label:'Current password',req:true},{k:'next',label:'New password (8+ characters)',req:true}];
    const sh=formSheet({title:'Change password',fields,onSave:async v=>{try{await api('POST','/api/password',v);toast('Password changed')}catch(e){return e.message}}});$$('input',sh).forEach(i=>i.type='password')};
}
function applySettings(){const d=S.config.settings||{};S.settings=normSettings(d)}

/* ---------- sync with Supabase (every 10 s while the app is open) ---------- */
let syncing=false,syncT=null;
async function sync(){
  if(syncing||!S.me)return;syncing=true;
  try{
    const r=await api('GET','/api/sync?since='+S.seq);
    if(r.full)COLLS.concat('config').forEach(c=>S[c]={});
    r.docs.forEach(d=>{(S[d.coll]||(S[d.coll]={}))[d.id]=d.data});
    (r.deleted||[]).forEach(d=>{if(S[d.coll])delete S[d.coll][d.id]});
    const changed=r.docs.length||(r.deleted||[]).length;S.seq=r.seq;
    if(r.full||r.docs.some(d=>d.coll==='config'))applySettings();
    if(!S.ready){S.ready=true;renderShell();routeHash()}
    else if(changed){const ae=document.activeElement;if(!(S.view==='settings'&&ae&&ae.tagName==='TEXTAREA'))renderList();if(!$('.sheet'))renderDetail()}
    $('#offline')?.remove();
  }catch(e){if(e.code==='offline'&&!$('#offline'))document.body.insertAdjacentHTML('beforeend','<div id="offline" class="toast">No internet connection. Changes can’t be saved until it is back.</div>')}
  finally{syncing=false}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});

async function start(){
  if(!sbClient()){authCard(`<h2>Not connected yet</h2><p style="margin:0">This copy of GFB FOOD - CMMS has no database settings. Open <span class="mono">config.js</span> and paste your Supabase project URL and anon key, as described in the setup guide.</p>`);return}
  if(/type=recovery/.test(location.hash)){showLogin('newpw');return}
  let st;try{st=await api('GET','/api/status')}catch(e){authCard(`<h2>Can’t reach the database</h2><p style="margin:0">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button>`);return}
  if(!st.user){showLogin();return}
  if(!st.user.active){authCard(`<h2>Waiting for approval</h2><p style="margin:0">You're signed in as <b>${esc(st.user.username)}</b>. An admin needs to approve your account before you can see records. Ask them to open <b>Users</b> and activate you.</p><div class="acts"><button class="btn pri" onclick="location.reload()">Check again</button><button class="btn" id="so">Sign out</button></div>`);$('#so').onclick=async()=>{await api('POST','/api/logout');location.reload()};return}
  S.me=st.user;S.canWrite=['admin','editor'].includes(st.user.role);S.canAdmin=st.user.role==='admin';
  VIEWS=ALLVIEWS.filter(v=>(v[0]!=='users'||S.canAdmin)&&(v[0]!=='incidents'||S.me.incidents));
  try{const v=localStorage.getItem('gfb_view');if(v&&VIEWS.some(x=>x[0]===v))S.view=v}catch(e){}
  renderMe();S.ready=false;S.seq=0;await sync();
  clearInterval(syncT);syncT=setInterval(()=>{if(document.visibilityState==='visible')sync()},10000);
}
if(sbClient())sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')showLogin('newpw')});
start();
</script>
</body></html>
