<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GFB Maint">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<title>GFB Asset &amp; Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a plant-room register. Header with module tabs, summary tiles first, then scannable tables; records open in a side drawer, edits in a sheet. */
:root{
  --bg:#eef2f2; --surface:#ffffff; --surface-2:#f6f8f8; --ink:#152226; --muted:#5a6b70; --line:#d5dddd;
  --accent:#0d6b5f; --accent-soft:#dcefeb; --accent-ink:#ffffff;
  --ok:#2e7d3c; --ok-soft:#e1f1e3; --warn:#a66300; --warn-soft:#fbeed8; --bad:#b3261e; --bad-soft:#f9e1df; --info:#2d5f9a; --info-soft:#e2ebf6;
  --shadow:0 10px 30px rgba(20,40,45,.14);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --surface:#162024; --surface-2:#1b272b; --ink:#e2eaeb; --muted:#93a4a8; --line:#2b383c;
  --accent:#4fb3a3; --accent-soft:#16352f; --accent-ink:#06201b;
  --ok:#6cc27a; --ok-soft:#173222; --warn:#e3a54a; --warn-soft:#352711; --bad:#f08a80; --bad-soft:#3a1a18; --info:#8ab4e8; --info-soft:#18283c;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517; --surface:#162024; --surface-2:#1b272b; --ink:#e2eaeb; --muted:#93a4a8; --line:#2b383c;
  --accent:#4fb3a3; --accent-soft:#16352f; --accent-ink:#06201b;
  --ok:#6cc27a; --ok-soft:#173222; --warn:#e3a54a; --warn-soft:#352711; --bad:#f08a80; --bad-soft:#3a1a18; --info:#8ab4e8; --info-soft:#18283c;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-inline:16px;padding-block:0 48px;max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1}
.brand .sub{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.brand .me{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.brand .me img{width:26px;height:26px;border-radius:50%}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
@media (min-width:700px){nav.tabs{flex-wrap:wrap;overflow-x:visible}}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 10px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs .n{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;margin-left:5px}
.banner{margin-block:12px 0;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 8px;letter-spacing:.01em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--line)}
.tile b{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile.bad{border-top-color:var(--bad)} .tile.bad b{color:var(--bad)}
.tile.warn{border-top-color:var(--warn)} .tile.warn b{color:var(--warn)}
.tile.ok{border-top-color:var(--ok)}
.tile.info{border-top-color:var(--info)}
.tile:hover{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:14px 10px}
.toolbar .grow{flex:1 1 200px;min-width:0}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.panel table{min-width:0}
.panel .tbl-wrap{border:0;border-radius:0}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.fc{font-family:var(--f-mono);font-size:10.5px;font-weight:500;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.bulk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:8px 12px;margin-bottom:10px}
th.ck,td.ck{width:36px;padding-right:0}td.ck input,th.ck input{width:18px;height:18px;accent-color:var(--accent)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:600;margin-bottom:4px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;margin-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar span{font-size:11px;color:var(--muted)}
.bar em{font-style:normal;font-size:11px;font-family:var(--f-mono);color:var(--ink)}
/* drawer & sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer .hd,.sheet .hd{display:flex;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .hd h2,.sheet .hd h2{margin:0;font-size:22px}
.drawer .bd{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv .lbl{display:block;margin-bottom:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);z-index:51;border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet+.scrim,.scrim.top{z-index:50}
.sheet form{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .req{color:var(--bad)}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.check input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--accent)}
.sec{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.02em;border-bottom:1px solid var(--line);padding-bottom:4px;grid-column:1/-1;margin-top:4px}
.sheet .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{color:var(--bad);font-weight:500}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:1fr 90px 110px 34px;gap:6px;align-items:center}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;min-width:0}
.file .th{height:90px;display:flex;align-items:center;justify-content:center;background:var(--surface);font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .m{padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.file .m a{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist div{display:grid;grid-template-columns:132px 1fr;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
a{color:var(--accent)}
.login{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:200px;z-index:30}
.menu .pop button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer}
.menu .pop button:hover{background:var(--surface-2)}
.menu>button{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink)}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.so{display:none}
.capa{display:grid;grid-template-columns:2fr 1fr 150px 90px auto 34px;gap:6px;align-items:center}
.capa .ca-ev{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.capa .ca-ev:empty{display:none}
.evc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;max-width:100%}.evc a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}.evc button{border:0;background:none;cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;color:inherit}.evc.up{opacity:.6;padding-right:10px}
.ev-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
@media (max-width:640px){.capa{grid-template-columns:1fr 1fr auto;padding-bottom:8px;border-bottom:1px dashed var(--line)}.capa .ca-a{grid-column:1/-1}.capa .ca-d{grid-column:2/-1}}
td.mono,td .mono{white-space:nowrap}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
@media (max-width:640px){table{min-width:0}.hs{display:none}.so{display:inline}.pill{white-space:normal}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}td{padding:9px 10px}.btn{padding:10px 14px}.tiles{grid-template-columns:repeat(2,1fr)}.brand .sub{display:none}.drawer .hd h2,.sheet .hd h2{font-size:20px}}
@media (max-width:560px){.line{grid-template-columns:1fr 70px 34px}.line .lc{display:none}.hist div{grid-template-columns:1fr}.brand h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head><body>
<header class="top">
  <div class="wrap" style="padding-block:0">
    <div class="brand">
      <div><h1>GFB Asset &amp; Maintenance</h1><div class="sub">Machines · Equipment · Spares · Contractors — ISO 22000 / HACCP / GMP records</div></div>
      <div class="me menu" id="me"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Modules"></nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty" style="margin-top:40px"><b>Opening the register…</b>Connecting to the shared database.</div>
</main>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script src="supabase.js"></script>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const fmtD=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'—';
const fmtDT=iso=>{if(!iso)return'—';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+Number(n));return isoOf(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const byStr=k=>(a,b)=>String(a[1][k]||'').localeCompare(String(b[1][k]||''),undefined,{numeric:true});
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}

/* ---------- state ---------- */
const DEFAULTS={
  categories:['Production machine','Production equipment','Hand tools & power tools','Material handling (forklift / reach truck)','Utilities & facility','Air-conditioning','Computer & IT','Office equipment','QC lab / measuring instrument'],
  departments:['Production','Warehouse','QA / QC','Office / Admin','Facility / utilities'],
  locList:[['Mixing room','Production'],['Packing area','Production'],['Raw material store','Warehouse'],['Finished goods store','Warehouse'],['QC lab','QA / QC'],['General office','Office / Admin'],['Meeting room','Office / Admin'],['Server / IT room','Office / Admin']].map(([name,dept])=>({name,dept})),
  partCats:['Spare part','Consumable','Lubricant','Filter','Belt / seal / gasket','Electrical','IT accessory']
};
const ASSET_STATUS=['Active','Under repair','Standby','Out of service','Disposed'];
const WO_TYPES=['Breakdown / repair','Preventive maintenance','Calibration','Inspection','Installation / modification'];
const WO_STATUS=['Open','In progress','Waiting parts','Completed','Verified'];
const PRIORITY=['Critical','High','Normal','Low'];
const INTERVALS=[['','No schedule'],['7','Weekly'],['14','Every 2 weeks'],['30','Monthly'],['60','Every 2 months'],['90','Quarterly'],['180','Half-yearly'],['365','Yearly']];
const S={assets:{},workorders:{},parts:{},suppliers:{},incidents:{},contracts:{},config:{},settings:{...DEFAULTS},view:'dash',f:{},detail:null,sel:new Set(),canWrite:false,canAdmin:false,me:null,seq:0,ready:false};
/* ---------- Supabase connection ---------- */
const CFG=window.GFB_CONFIG||{};
let sb=null;
function sbClient(){if(!sb){if(!window.supabase||!CFG.supabaseUrl||/YOUR-PROJECT|^\s*$/.test(CFG.supabaseUrl)||!CFG.supabaseAnonKey)return null;sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}return sb}
const ERR=(m,code,body)=>Object.assign(new Error(m),{code,body});
function sbErr(e){const m=(e&&e.message)||String(e);if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return ERR('Cannot reach the database. Check your internet connection.','offline');if(/JWT expired|invalid JWT|not authenticated|PGRST301/i.test(m+(e&&e.code||'')))return ERR('Please sign in again.',401);return ERR(m,(e&&e.code)||'error')}
async function rpc(fn,args){let res;try{res=await sb.rpc(fn,args)}catch(e){throw sbErr(e)}if(res.error){const x=sbErr(res.error);if(x.code===401){S.me=null;showLogin()}throw x}return res.data}
async function api(method,path,body){
  if(!sbClient())throw ERR('This copy is not connected to a database yet. Fill in config.js.','config');
  let m;
  if(path==='/api/status'){const {data:{session}}=await sb.auth.getSession();if(!session)return{user:null};let p;try{p=await rpc('my_profile',{})}catch(e){if(e.code===401)return{user:null};throw e}if(!p)return{user:null,orphan:true};
    return{user:{id:p.id,name:p.name||p.email,username:p.email,role:p.role,active:p.active,incidents:p.role==='admin'||!!p.incident_access}}}
  if(path==='/api/login'){const {error}=await sb.auth.signInWithPassword({email:String(body.username||'').trim(),password:body.password||''});if(error)throw ERR(/invalid login/i.test(error.message)?'Wrong email or password.':/not confirmed/i.test(error.message)?'Confirm your email first: open the link Supabase sent you.':error.message,401);return{ok:true}}
  if(path==='/api/signup'){if(String(body.password||'').length<8)throw ERR('Use a password of at least 8 characters.',400);const {data,error}=await sb.auth.signUp({email:String(body.email||'').trim(),password:body.password,options:{data:{name:String(body.name||'').trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw ERR(error.message,400);return{ok:true,session:!!(data&&data.session)}}
  if(path==='/api/forgot'){const {error}=await sb.auth.resetPasswordForEmail(String(body.email||'').trim(),{redirectTo:location.origin+location.pathname});if(error)throw ERR(error.message,400);return{ok:true}}
  if(path==='/api/logout'){try{await sb.auth.signOut()}catch(e){}return{ok:true}}
  if(path==='/api/password'){if(body.current){const {data:{user}}=await sb.auth.getUser();const {error:e1}=await sb.auth.signInWithPassword({email:user.email,password:body.current});if(e1)throw ERR('Your current password is wrong.',400)}
    if(String(body.next||'').length<8)throw ERR('Use at least 8 characters.',400);const {error}=await sb.auth.updateUser({password:body.next});if(error)throw ERR(error.message,400);return{ok:true}}
  if((m=path.match(/^\/api\/sync\?since=(\d+)/))){const since=+m[1];const docs=[];
    for(let from=0;;from+=1000){const {data,error}=await sb.from('docs').select('coll,id,data,seq').gt('seq',since).order('seq').range(from,from+999);if(error)throw sbErr(error);docs.push(...data);if(data.length<1000)break}
    let deleted=[];if(since){const {data,error}=await sb.from('tombstones').select('coll,id,seq').gt('seq',since);if(error)throw sbErr(error);deleted=data}
    return{seq:Math.max(since,...docs.map(d=>+d.seq),...deleted.map(d=>+d.seq)),docs,deleted,full:!since}}
  if((m=path.match(/^\/api\/docs\/([a-z]+)\/([A-Za-z0-9_\-]+)$/))){
    if(method==='PUT'){let r;try{r=await rpc('save_doc',{p_coll:m[1],p_id:m[2],p_data:body.data,p_act:body.act,p_base:body.base??null})}catch(e){if(m[1]==='contracts'&&/Unknown record type/i.test(e.message))throw ERR('Contracts are not switched on in the database yet. An admin needs to run enable-contracts.sql in Supabase (SQL Editor).',400);throw e}
      if(r.conflict)throw ERR('Someone else changed this record while you were editing. Your copy has been refreshed; please re-enter your change.',409,{current:r.current});return{ok:true,doc:r.doc}}
    if(method==='DELETE'){await rpc('delete_doc',{p_coll:m[1],p_id:m[2]});return{ok:true}}}

const MIME={'.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp','.gif':'image/gif','.heic':'image/heic','.pdf':'application/pdf'};
async function uploadFile(coll,id,file){
  const ext=((file.name||'').match(/\.[A-Za-z0-9]+$/)||[''])[0].toLowerCase();
  const ct=/^(image\/(jpeg|png|webp|gif|heic)|application\/pdf)$/.test(file.type)?file.type:(MIME[ext]||file.type||'');
  if(!/^(image\/(jpeg|png|webp|gif|heic)|application\/pdf)$/.test(ct))throw ERR('Only PDF files and photos (JPG, PNG, WebP, HEIC) can be attached. Save Word or Excel reports as PDF first.',400);
  if(file.size>25*1048576)throw ERR('The file is over 25 MB.',400);
  const name=file.name||('photo-'+Date.now()+'.jpg');
  const path=`${coll}/${id}/${Date.now().toString(36)}-${name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80)}`;
  const {error}=await sb.storage.from('attachments').upload(path,file,{contentType:ct,upsert:false});
  if(error)throw ERR(/row-level security|not authorized|unauthorized/i.test(error.message)?'You do not have permission to upload here.':error.message,400);
  return{id:path,name,ct,size:file.size};
}

function renderTabs(){
  const c=counts();const badge={pm:c.overdue,wos:c.open,parts:c.low,contracts:c.renew};
  $('#tabs').innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}" aria-current="${S.view===k}">${l}${badge[k]?`<span class="n">${badge[k]}</span>`:''}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v,filters){S.view=v;if(filters)S.f[v]={...(S.f[v]||{}),...filters};try{localStorage.setItem('gfb_view',v)}catch(e){}renderShell();window.scrollTo(0,0)}
function renderShell(){
  renderTabs();
  const V=VIEW[S.view];
  $('#main').innerHTML=(S.canWrite?'':'<div class="banner">Your account is view-only. Ask an admin to make you an Editor to add or update records.</div>')+V.shell();
  if(V.bind)V.bind();renderList();
}
function renderList(){const el=$('#list');if(el){el.innerHTML=VIEW[S.view].list();if(S.view==='settings')bindLocations(el);if(S.view==='assets')bindBulk(el);bindRows(el);fillNames(el);
  const d=$('#dAdd',el);if(d)d.onclick=()=>assetForm();
  $$('[data-eu]',el).forEach(b=>b.onclick=()=>userForm(b.dataset.eu));
  $$('[data-pm]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const a=A(b.dataset.pm);woForm(null,{assetId:b.dataset.pm,type:'Preventive maintenance',title:'Scheduled preventive maintenance',tasksDone:a?.pmTasks||''})})}renderTabs()}
function bindRows(root){$$('[data-open]',root).forEach(r=>r.onclick=e=>{if(e.target.closest('button,a,input'))return;const[k,id]=r.dataset.open.split(':');openDetail(k,id)});
  $$('[data-go]',root).forEach(b=>b.onclick=()=>{const[v,f,val]=b.dataset.go.split('|');go(v,f?{[f]:val}:null)})}
const W=fn=>S.canWrite?fn():'';
const fval=(v,k,d='')=>(S.f[v]&&S.f[v][k])??d;
function bindFilters(v){$$('[data-f]').forEach(el=>{const h=()=>{S.f[v]={...(S.f[v]||{}),[el.dataset.f]:el.value};renderList()};el.oninput=h;el.onchange=h})}
const match=(q,...xs)=>!q||xs.join(' ').toLowerCase().includes(q.toLowerCase());
const emptyRow=(cols,title,msg)=>`<tr><td colspan="${cols}"><div class="empty"><b>${title}</b>${msg}</div></td></tr>`;

/* ---------- views ---------- */
const VIEW={};
VIEW.dash={shell:()=>'<div id="list"></div>',list(){
  const as=Object.entries(S.assets),ws=Object.entries(S.workorders),ps=Object.entries(S.parts),ss=Object.entries(S.suppliers);
  if(!as.length&&!ws.length){
    return`<div class="panel" style="margin-top:22px"><div class="empty"><b>No assets registered yet</b>Start with your machine list. Add items one by one, or import a CSV (Asset register → Import CSV) for production machines, forklifts, office aircon units and computers.<div class="acts" style="justify-content:center;margin-top:14px">${W(()=>'<button class="btn pri" id="dAdd">Add first asset</button>')}<button class="btn" data-go="assets">Go to asset register</button></div></div></div>`;
  }
  const pm=as.map(([id,a])=>[id,a,pmInfo(a)]).filter(x=>x[2]);
  const overdue=pm.filter(x=>x[2].state==='overdue'),soon=pm.filter(x=>x[2].state==='soon'),unset=pm.filter(x=>x[2].state==='unset');
  const open=ws.filter(([,w])=>openWO(w)),toVerify=ws.filter(([,w])=>w.status==='Completed');
  const low=ps.filter(([,p])=>lowStock(p));const down=as.filter(([,a])=>a.status==='Under repair');
  const watch=[];
  as.forEach(([id,a])=>{const w=dateWatch(a.warrantyUntil);if(w&&w.state!=='ok'&&w.days>-30)watch.push(['asset:'+id,a.code+' · '+a.name,'Warranty',w,a.warrantyUntil]);
    const c=dateWatch(a.calibDue);if(c&&c.state!=='ok'&&a.status!=='Disposed')watch.push(['asset:'+id,a.code+' · '+a.name,'Calibration',c,a.calibDue])});
  ss.forEach(([id,s])=>{const w=dateWatch(s.evalDue);if(w&&w.state!=='ok')watch.push(['supplier:'+id,s.name,'Supplier evaluation',w,s.evalDue])});
  Object.entries(S.contracts).forEach(([id,c])=>{const i=conInfo(c);if(i&&(i.state==='soon'||i.state==='expired'))watch.push(['contract:'+id,c.title,'Contract renewal',{days:i.days,state:i.state==='expired'?'overdue':'soon'},c.endDate])});
  watch.sort((a,b)=>a[3].days-b[3].days);
  const now=new Date();const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push([d.getFullYear()+'-'+pad(d.getMonth()+1),d.toLocaleString('en-MY',{month:'short'})])}
  const mcost=months.map(([k,l])=>[l,ws.filter(([,w])=>woDate(w).startsWith(k)).reduce((s,[,w])=>s+woCost(w),0)]);
  const max=Math.max(1,...mcost.map(m=>m[1]));
  const ytdStart=(now.getMonth()>=6?now.getFullYear():now.getFullYear()-1)+'-07-01';
  const ytd=ws.filter(([,w])=>woDate(w)>=ytdStart).reduce((s,[,w])=>s+woCost(w),0);
  const tile=(cls,n,l,go)=>`<button type="button" class="tile ${n?cls:'ok'}" data-go="${go}"><span class="lbl">${l}</span><b>${n}</b></button>`;
  const sortedPM=[...overdue,...soon].sort((a,b)=>a[2].days-b[2].days).slice(0,8);
  return`<div class="tiles">
    ${tile('bad',overdue.length,'PM overdue','pm|state|overdue')}
    ${tile('warn',soon.length,'PM due in 14 days','pm|state|soon')}
    ${tile('bad',open.length,'Open work orders','wos|status|open')}
    ${tile('warn',toVerify.length,'Awaiting QA verification','wos|status|Completed')}
    ${tile('bad',down.length,'Machines under repair','assets|status|Under repair')}
    ${tile('warn',low.length,'Spares at re-order level','parts|low|1')}
    ${tile('warn',Object.values(S.contracts).filter(conDue).length,'Contract renewals due','contracts|state|due')}
    ${S.me&&S.me.incidents?tile('bad',Object.values(S.incidents).filter(i=>i.status!=='Closed').length,'Open incidents','incidents|status|open')+tile('bad',Object.values(S.incidents).filter(incPending).length,'DOSH / PERKESO reports due','incidents|status|due'):''}
  </div>
  <div class="grid2">
    <div class="panel"><h3>Preventive maintenance due</h3>${sortedPM.length?`<div class="tbl-wrap"><table><thead><tr><th>Asset</th><th class="hs">Department · location</th><th>Due</th><th></th></tr></thead><tbody>${sortedPM.map(([id,a,i])=>`<tr data-open="asset:${id}"><td><span class="mono">${esc(a.code)}</span><br>${esc(a.name)}${a.foodContact?'<span class="fc">FC</span>':''}</td><td class="hs">${esc(place(a)||'—')}</td><td>${pmPill(i)}</td><td class="r">${W(()=>`<button class="btn sm" data-pm="${id}">Log PM</button>`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Nothing due in the next 14 days</b>${unset.length?`${unset.length} scheduled asset(s) still need a last-PM date.`:'All scheduled assets are up to date.'}</div>`}</div>
    <div class="panel"><h3>Open jobs</h3>${open.length?`<div class="tbl-wrap"><table><thead><tr><th>WO</th><th>Asset / problem</th><th>Status</th></tr></thead><tbody>${open.sort((a,b)=>PRIORITY.indexOf(a[1].priority)-PRIORITY.indexOf(b[1].priority)).slice(0,8).map(([id,w])=>`<tr data-open="wo:${id}"><td class="mono">${esc(w.no)}<br>${prPill(w.priority)}</td><td>${esc(woWhat(w))}<br><span class="muted">${esc(w.title)}</span></td><td>${woPill(w.status)}<br><span class="muted">${fmtD(w.reportDate)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No open jobs</b>Breakdowns and requests you log will show here until QA verifies them.</div>'}</div>
    <div class="panel"><h3>Maintenance spend</h3><div class="muted">Invoices + internal labour + spares issued. FY from 1 July: <b class="num" style="color:var(--ink)">${rm(ytd)}</b></div>
      <div class="bars">${mcost.map(([l,v])=>`<div class="bar"><em>${v?Math.round(v).toLocaleString('en-MY'):''}</em><i style="height:${Math.max(1.5,v/max*100)}%"></i><span>${l}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>Watch list</h3>${watch.length||low.length?`<div class="tbl-wrap"><table><tbody>${watch.slice(0,8).map(([o,n,t,w,d])=>`<tr data-open="${o}"><td>${esc(n)}<br><span class="muted">${t} · ${fmtD(d)}</span></td><td class="r">${watchPill(w)}</td></tr>`).join('')}${low.slice(0,6).map(([id,p])=>`<tr data-open="part:${id}"><td>${esc(p.name)}<br><span class="muted">Spare · re-order level ${esc(p.minQty)} ${esc(p.unit||'')}</span></td><td class="r"><span class="pill ${num(p.qty)<=0?'bad':'warn'}">${num(p.qty)} ${esc(p.unit||'')} left</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>All clear</b>Warranty, calibration and supplier-evaluation dates within 30 days, and low spares, appear here.</div>'}</div>
  </div>`;
},};

VIEW.assets={
  shell:()=>`<h2>Asset register</h2><div class="toolbar">
    <input class="grow" type="search" id="q_a" data-f="q" placeholder="Search code, name, serial, user…" value="${esc(fval('assets','q'))}">
    <select data-f="cat" id="c_a" style="width:auto"><option value="">All categories</option>${S.settings.categories.map(c=>opt(c,fval('assets','cat'))).join('')}</select>
    <select data-f="dept" id="d_a" style="width:auto"><option value="">All departments</option>${opt(['__none','No department yet'],fval('assets','dept'))}${S.settings.departments.map(c=>opt(c,fval('assets','dept'))).join('')}</select>
    <select data-f="loc" id="l_a" style="width:auto"><option value="">All locations</option>${allLocs().map(c=>opt(c,fval('assets','loc'))).join('')}</select>
    <select data-f="status" id="s_a" style="width:auto"><option value="">All statuses</option>${ASSET_STATUS.map(c=>opt(c,fval('assets','status'))).join('')}</select>
    ${W(()=>'<button class="btn pri" id="addA">Add asset</button><button class="btn" id="impA">Import CSV</button>')}<button class="btn" id="expA">Export CSV</button><button class="btn" id="qrA">Print QR labels</button></div><div id="list"></div>`,
  bind(){bindFilters('assets');const a=$('#addA');if(a)a.onclick=()=>assetForm();const i=$('#impA');if(i)i.onclick=importAssets;$('#expA').onclick=()=>exportCSV('assets');$('#qrA').onclick=()=>printLabels(filteredAssets().map(x=>x[0]))},
  list(){
    const rows=filteredAssets();
    const ls=$('#l_a');if(ls){const cur=ls.value;ls.innerHTML='<option value="">All locations</option>'+allLocs().map(c=>opt(c,cur)).join('')}
    return`${S.canWrite&&S.sel.size?`<div class="bulk"><b>${S.sel.size} selected</b><button class="btn pri sm" type="button" id="bulkSet">Set department &amp; location</button><button class="btn sm" type="button" id="bulkClear">Clear selection</button></div>`:''}<div class="tbl-wrap"><table><thead><tr>${S.canWrite?`<th class="ck"><input type="checkbox" id="selAll" aria-label="Select all shown"${rows.length&&rows.every(([id])=>S.sel.has(id))?' checked':''}></th>`:''}<th class="hs">Code</th><th>Asset</th><th class="hs">Category · department / location</th><th>Status</th><th>Next PM</th><th class="r hs">Jobs</th></tr></thead><tbody>${rows.length?rows.map(([id,a])=>{const n=Object.values(S.workorders).filter(w=>w.assetId===id).length;return`<tr data-open="asset:${id}">${S.canWrite?`<td class="ck"><input type="checkbox" data-sel="${id}" aria-label="Select ${esc(a.code)}"${S.sel.has(id)?' checked':''}></td>`:''}<td class="mono hs">${esc(a.code)}</td><td><span class="so mono muted">${esc(a.code)}<br></span>${esc(a.name)}${a.foodContact?'<span class="fc" title="Food-contact">FC</span>':''}<br><span class="muted">${esc([a.manufacturer,a.model].filter(Boolean).join(' '))}${a.assignedTo?' · '+esc(a.assignedTo):''}</span></td><td class="hs">${esc(a.category||'—')}<br><span class="muted">${esc(place(a))}</span></td><td>${statusPill(a.status)}</td><td>${pmPill(pmInfo(a))}</td><td class="r num hs">${n}</td></tr>`}).join(''):emptyRow(S.canWrite?7:6,Object.keys(S.assets).length?'No assets match':'No assets yet',Object.keys(S.assets).length?'Clear the search or filters.':'Add assets one by one or import your list from a CSV file.')}</tbody></table></div><p class="muted" style="margin-top:8px">${rows.length} of ${Object.keys(S.assets).length} assets · FC = food-contact equipment</p>`;
  }};

VIEW.wos={
  shell:()=>`<h2>Work orders</h2><div class="toolbar">
    <input class="grow" type="search" data-f="q" id="q_w" placeholder="Search WO no., asset, problem, invoice no…" value="${esc(fval('wos','q'))}">
    <select data-f="status" id="s_w" style="width:auto">${[['all','All statuses'],['open','Open (not completed)'],...WO_STATUS.map(s=>[s,s])].map(o=>opt(o,fval('wos','status','all'))).join('')}</select>
    <select data-f="type" id="t_w" style="width:auto"><option value="">All job types</option>${WO_TYPES.map(c=>opt(c,fval('wos','type'))).join('')}</select>
    ${W(()=>'<button class="btn pri" id="addW">New work order</button>')}<button class="btn" id="expW">Export CSV</button></div><div id="list"></div>`,
  bind(){bindFilters('wos');const a=$('#addW');if(a)a.onclick=()=>woForm();$('#expW').onclick=()=>exportCSV('workorders')},
  list(){
    const q=fval('wos','q'),st=fval('wos','status','all'),t=fval('wos','type');
    const rows=Object.entries(S.workorders).filter(([,w])=>(st==='all'||(st==='open'?openWO(w):w.status===st))&&(!t||w.type===t)&&match(q,w.no,woWhat(w),w.title,w.invoiceNo,w.supplierReportNo,sup(w.supplierId)?.name)).sort((a,b)=>String(b[1].reportDate).localeCompare(String(a[1].reportDate))||String(b[1].no).localeCompare(String(a[1].no)));
    return`<div class="tbl-wrap"><table><thead><tr><th>WO no.</th><th>Asset · problem</th><th class="hs">Type</th><th class="hs">Contractor</th><th>Status</th><th class="r">Cost</th></tr></thead><tbody>${rows.length?rows.map(([id,w])=>`<tr data-open="wo:${id}"><td class="mono">${esc(w.no)}<br><span class="muted">${fmtD(w.reportDate)}</span></td><td>${esc(woWhat(w))}<br><span class="muted">${esc(w.title)}</span></td><td class="hs">${esc(w.type)}<br>${prPill(w.priority)}</td><td class="hs">${esc(sup(w.supplierId)?.name||w.performedBy||'—')}${(w.files||[]).length?`<br><span class="muted">${(w.files||[]).length} file(s)</span>`:''}</td><td>${woPill(w.status)}</td><td class="r num">${woCost(w)?rm(woCost(w)):'—'}</td></tr>`).join(''):emptyRow(6,'No work orders here','Log a breakdown, repair or PM job with “New work order”.')}</tbody></table></div><p class="muted" style="margin-top:8px">${rows.length} work order(s) · total ${rm(rows.reduce((s,[,w])=>s+woCost(w),0))}</p>`;
  }};

VIEW.pm={
  shell:()=>`<h2>PM &amp; calibration schedule</h2><div class="toolbar">
    <input class="grow" type="search" data-f="q" id="q_p" placeholder="Search asset…" value="${esc(fval('pm','q'))}">
    <select data-f="state" id="s_p" style="width:auto">${[['','All scheduled'],['overdue','Overdue'],['soon','Due in 14 days'],['unset','Missing last-PM date']].map(o=>opt(o,fval('pm','state'))).join('')}</select></div><div id="list"></div>`,
  bind(){bindFilters('pm')},
  list(){
    const q=fval('pm','q'),st=fval('pm','state');
    const rows=Object.entries(S.assets).map(([id,a])=>[id,a,pmInfo(a)]).filter(([,a,i])=>i&&(!st||i.state===st)&&match(q,a.code,a.name,a.dept,a.location)).sort((x,y)=>(x[2].days??-9999)-(y[2].days??-9999));
    const cal=Object.entries(S.assets).filter(([,a])=>a.calibDue&&a.status!=='Disposed'&&match(q,a.code,a.name)).sort(byStr('calibDue'));
    const iv=v=>(INTERVALS.find(x=>x[0]===String(v))||['',v+' days'])[1];
    return`<div class="tbl-wrap"><table><thead><tr><th>Asset</th><th class="hs">Frequency</th><th class="hs">Last PM</th><th>Next due</th><th></th></tr></thead><tbody>${rows.length?rows.map(([id,a,i])=>`<tr data-open="asset:${id}"><td><span class="mono">${esc(a.code)}</span> ${esc(a.name)}${a.foodContact?'<span class="fc">FC</span>':''}<br><span class="muted">${esc(place(a))}</span></td><td class="hs">${iv(a.pmInterval)}</td><td class="hs">${fmtD(a.lastPM)}</td><td>${pmPill(i)}</td><td class="r">${W(()=>`<button class="btn sm" data-pm="${id}">Log PM</button>`)}</td></tr>`).join(''):emptyRow(5,'No PM schedules here','Set a preventive-maintenance frequency on an asset to schedule it.')}</tbody></table></div>
    <h2>Calibration due</h2><div class="tbl-wrap"><table><thead><tr><th>Instrument / asset</th><th>Frequency</th><th>Next calibration</th></tr></thead><tbody>${cal.length?cal.map(([id,a])=>`<tr data-open="asset:${id}"><td><span class="mono">${esc(a.code)}</span> ${esc(a.name)}</td><td>${a.calibInterval?iv(a.calibInterval):'—'}</td><td>${fmtD(a.calibDue)} ${watchPill(dateWatch(a.calibDue))}</td></tr>`).join(''):emptyRow(3,'No calibration dates set','Weighing scales, thermometers, moisture analysers and metal detectors belong here. Set “Next calibration due” on the asset.')}</tbody></table></div>`;
  }};

VIEW.parts={
  shell:()=>`<h2>Spare parts &amp; consumables</h2><div class="toolbar">
    <input class="grow" type="search" data-f="q" id="q_s" placeholder="Search part code, name, asset…" value="${esc(fval('parts','q'))}">
    <select data-f="cat" id="c_s" style="width:auto"><option value="">All categories</option>${S.settings.partCats.map(c=>opt(c,fval('parts','cat'))).join('')}</select>
    <select data-f="low" id="l_s" style="width:auto">${[['','All stock'],['1','At / below re-order level']].map(o=>opt(o,fval('parts','low'))).join('')}</select>
    ${W(()=>'<button class="btn pri" id="addP">Add part</button>')}<button class="btn" id="expP">Export CSV</button></div><div id="list"></div>`,
  bind(){bindFilters('parts');const a=$('#addP');if(a)a.onclick=()=>partForm();$('#expP').onclick=()=>exportCSV('parts')},
  list(){
    const q=fval('parts','q'),c=fval('parts','cat'),lo=fval('parts','low');
    const rows=Object.entries(S.parts).filter(([,p])=>(!c||p.category===c)&&(!lo||lowStock(p))&&match(q,p.code,p.name,p.compatible,p.store)).sort(byStr('code'));
    const val=rows.reduce((s,[,p])=>s+num(p.qty)*num(p.unitCost),0);
    return`<div class="tbl-wrap"><table><thead><tr><th class="hs">Code</th><th>Item</th><th class="hs">Category · store</th><th class="r">On hand</th><th class="r hs">Re-order at</th><th class="r hs">Value</th></tr></thead><tbody>${rows.length?rows.map(([id,p])=>`<tr data-open="part:${id}"><td class="mono hs">${esc(p.code)}</td><td><span class="so mono muted">${esc(p.code)}<br></span>${esc(p.name)}${p.foodGrade?'<span class="fc">FOOD-GRADE</span>':''}<br><span class="muted">${esc(p.compatible||'')}</span></td><td class="hs">${esc(p.category||'—')}<br><span class="muted">${esc(p.store||'')}</span></td><td class="r num"><span class="dot ${lowStock(p)?(num(p.qty)<=0?'bad':'warn'):'ok'}"></span>${num(p.qty)} ${esc(p.unit||'')}</td><td class="r num hs">${p.minQty===''||p.minQty==null?'—':esc(p.minQty)}</td><td class="r num hs">${rm(num(p.qty)*num(p.unitCost))}</td></tr>`).join(''):emptyRow(6,'No spares or consumables','Add parts you keep in store: bearings, belts, seals, filters, food-grade grease, fuses, toner.')}</tbody></table></div><p class="muted" style="margin-top:8px">${rows.length} item(s) · stock value ${rm(val)}</p>`;
  }};

VIEW.suppliers={
  shell:()=>`<h2>Contractors &amp; vendors</h2><div class="toolbar">
    <input class="grow" type="search" data-f="q" id="q_c" placeholder="Search company, service…" value="${esc(fval('suppliers','q'))}">
    ${W(()=>'<button class="btn pri" id="addS">Add contractor / vendor</button>')}<button class="btn" id="expS">Export CSV</button></div><div id="list"></div>`,
  bind(){bindFilters('suppliers');const a=$('#addS');if(a)a.onclick=()=>supForm();$('#expS').onclick=()=>exportCSV('suppliers')},
  list(){
    const q=fval('suppliers','q');
    const rows=Object.entries(S.suppliers).filter(([,s])=>match(q,s.name,s.services,s.contact)).sort(byStr('name'));
    return`<div class="tbl-wrap"><table><thead><tr><th>Company</th><th class="hs">Services</th><th class="hs">Contact</th><th>Approval</th><th class="r">Jobs · spend</th></tr></thead><tbody>${rows.length?rows.map(([id,s])=>{const ws=Object.values(S.workorders).filter(w=>w.supplierId===id);const ev=dateWatch(s.evalDue);return`<tr data-open="supplier:${id}"><td>${esc(s.name)}<br><span class="muted">${esc(s.kind||'')}</span></td><td class="hs">${esc(s.services||'—')}</td><td class="hs">${esc(s.contact||'—')}<br><span class="muted">${esc(s.phone||'')}</span></td><td><span class="pill ${({'Approved':'ok','Under evaluation':'warn','Not approved':'bad'})[s.approval]||''}">${esc(s.approval||'Not set')}</span>${ev&&ev.state!=='ok'?'<br>'+watchPill(ev,'Eval'):''}</td><td class="r num">${ws.length}<br><span class="muted">${rm(ws.reduce((t,w)=>t+num(w.invoiceAmount),0))}</span></td></tr>`}).join(''):emptyRow(5,'No contractors yet','Add service contractors and parts vendors to link them to jobs and invoices.')}</tbody></table></div>`;
  }};

VIEW.activity={
  shell:()=>`<h2>Activity log</h2><p class="muted" style="margin-top:-4px">Every create and change, with who did it and when. Each record keeps its last 60 changes.</p><div class="toolbar"><input class="grow" type="search" data-f="q" id="q_l" placeholder="Search…" value="${esc(fval('activity','q'))}"></div><div id="list"></div>`,
  bind(){bindFilters('activity')},
  list(){
    const q=fval('activity','q');const ev=[];
    const lab={assets:['asset',r=>r.code+' · '+r.name],workorders:['wo',r=>r.no+' · '+woWhat(r)],parts:['part',r=>r.code+' · '+r.name],suppliers:['supplier',r=>r.name],incidents:['incident',r=>r.no+' · '+r.title],contracts:['contract',r=>r.title]};

        msg.textContent=`Importing ${docs.length} records…`;const r=await api('POST','/api/import',{docs});msg.textContent=`${r.imported} records imported.`;S.seq=0;await sync();toast(r.imported+' records imported')}

VIEW.users={
  shell:()=>`<h2>Users</h2><p class="muted" style="margin-top:-4px"><b>Admin</b>: everything, including users, deleting records and backups. <b>Editor</b>: add and update records and attachments. <b>Viewer</b>: read only. <b>Incident access</b> lets a person see the incident register, which holds injury and health details.</p>

let USERS=[];

function usersHTML(){const L=USERS.slice().sort((a,b)=>(a.active===b.active?0:a.active?1:-1)||String(a.name).localeCompare(String(b.name)));

function userForm(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  const fields=[{k:'name',label:'Full name',req:true},{k:'role',label:'Role',type:'select',opts:[['editor','Editor – add and update records'],['viewer','Viewer – read only'],['admin','Admin – everything']],blank:false},
    {k:'active',label:'Account active (can sign in and see records)',type:'check',full:true},{k:'incidents',label:'Incident access (sees injury and health details in the incident register)',type:'check',full:true}];
  formSheet({title:(u.active?'Edit ':'Approve ')+(u.name||u.email),fields,data:{name:u.name,role:u.active?u.role:'editor',active:true,incidents:!!u.incident_access},onSave:async v=>{
    try{await api('PUT','/api/users/'+u.id,v);toast('Saved');loadUsers()}catch(e){return e.message}}});
}

function openDetail(kind,id){S.detail={kind,id};renderDetail()}

  const coll={asset:'assets',wo:'workorders',part:'parts',supplier:'suppliers',incident:'incidents',contract:'contracts'}[kind];const r=S[coll][id];
  $$('.drawer,.scrim:not(.top)',l).forEach(e=>e.remove());
  if(!r){S.detail=null;return}
  const scrollY=l.dataset.sy||0;

  l.insertAdjacentHTML('afterbegin',`<div class="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(html.title)}"><div class="hd"><div style="min-width:0"><div class="lbl">${html.eyebrow}</div><h2>${esc(html.title)}</h2><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${html.pills||''}</div></div><button class="x" type="button" aria-label="Close">×</button></div><div class="bd">${html.body}

  const d=$('.drawer',l);$('.x',d).onclick=()=>closeLayer('drawer');$('.scrim:not(.top)',l).onclick=()=>closeLayer('drawer');

}

      ${kv([['Department',esc(a.dept)],['Location / room',esc(a.location)],['Fixed asset no.',a.faNo?`<span class="mono">${esc(a.faNo)}</span>`:''],['Manufacturer / model',esc([a.manufacturer,a.model].filter(Boolean).join(' '))],['Serial no.',a.serial?`<span class="mono">${esc(a.serial)}</span>`:''],['Supplier',a.supplierId?`<a href="#" data-sup="${a.supplierId}">${esc(sup(a.supplierId)?.name||'')}</a>`:''],['Purchased',a.purchaseDate?fmtD(a.purchaseDate):''],['Warranty',a.warrantyUntil?fmtD(a.warrantyUntil)+' '+watchPill(dateWatch(a.warrantyUntil)):''],['Assigned to',esc(a.assignedTo)],['Next PM',pmPill(pmInfo(a))],['Last PM',fmtD(a.lastPM)],isIT(a)&&!a.calibDue?['Support / licence',(()=>{const c=Object.values(S.contracts).filter(x=>x.assetId===id&&x.status!=='Cancelled').sort((x,y)=>String(x.endDate).localeCompare(String(y.endDate)))[0];return c?conPill(c):''})()]:['Calibration due',a.calibDue?fmtD(a.calibDue)+' '+watchPill(dateWatch(a.calibDue)):'']])}

      ${(()=>{const sib=sameModel(id,a);return sib.length?`<div><h3>Same model elsewhere</h3><p class="muted" style="margin:0 0 8px">${sib.length} other unit(s) of ${esc([a.manufacturer,a.model].filter(Boolean).join(' '))}</p><div class="tbl-wrap"><table style="min-width:0"><tbody>${sib.map(([sid,b])=>`<tr data-open="asset:${sid}"><td class="mono">${esc(b.code)}</td><td>${esc(place(b)||'—')}${b.assignedTo?'<br><span class="muted">'+esc(b.assignedTo)+'</span>':''}</td><td>${statusPill(b.status)}</td></tr>`).join('')}</tbody></table></div></div>`:''})()}
      <div><h3>Maintenance history</h3><p class="muted" style="margin:0 0 8px">${ws.length} job(s) · ${rm(total)} · ${down} h downtime</p>${ws.length?`<div class="tbl-wrap"><table style="min-width:0"><tbody>${ws.map(([wid,w])=>`<tr data-open="wo:${wid}"><td class="mono">${esc(w.no)}<br><span class="muted">${fmtD(w.reportDate)}</span></td><td>${esc(w.title)}<br><span class="muted">${esc(w.type)}</span></td><td>${woPill(w.status)}</td><td class="r num">${rm(woCost(w))}</td></tr>`).join('')}</tbody></table></div>`:'<span class="muted">No jobs logged for this asset yet.</span>'}</div>
      ${S.me&&S.me.incidents?(()=>{const inc=Object.entries(S.incidents).filter(([,i])=>i.assetId===id);return inc.length?`<div><h3>Incidents involving this asset</h3><div class="tbl-wrap"><table style="min-width:0"><tbody>${inc.map(([iid,i])=>`<tr data-open="incident:${iid}"><td class="mono">${esc(i.no)}<br><span class="muted">${fmtD(i.incDate)}</span></td><td>${esc(i.title)}</td><td>${incStatusPill(i.status)}</td></tr>`).join('')}</tbody></table></div></div>`:''})():''}
      ${usedParts.length?`<div><h3>Spares for this asset</h3>${usedParts.map(p=>`<div>${esc(p.code)} · ${esc(p.name)} — <b class="num">${num(p.qty)} ${esc(p.unit||'')}</b> in store</div>`).join('')}</div>`:''}`,
      bind(d){const e=$('#dEdit',d);if(e)e.onclick=()=>assetForm(id);const du=$('#dDup',d);if(du)du.onclick=()=>assetForm(null,id);const mvb=$('#dMove',d);if(mvb)mvb.onclick=()=>moveAsset(id);const n=$('#dNewWO',d);if(n)n.onclick=()=>woForm(null,{assetId:id});$('#dQR',d).onclick=()=>printLabels([id]);const p=$('#dPM',d);if(p)p.onclick=()=>woForm(null,{assetId:id,type:'Preventive maintenance',title:'Scheduled preventive maintenance',tasksDone:a.pmTasks||''});$$('[data-sup]',d).forEach(x=>x.onclick=ev=>{ev.preventDefault();openDetail('supplier',x.dataset.sup)});const ac=$('#dAddCon',d);if(ac)ac.onclick=()=>conForm(null,{assetId:id,supplierId:a.supplierId||'',dept:a.dept||'',title:a.name+' – support',type:isIT(a)?'Support agreement / AMC':'Service contract (non-IT)'})}};
  },

    return{eyebrow:'Work order · '+esc(w.no),title:w.title,pills:woPill(w.status)+prPill(w.priority)+`<span class="pill">${esc(w.type)}</span>`,

      ${w.incidentId?`<div class="banner" style="margin:0">${S.me&&S.me.incidents&&S.incidents[w.incidentId]?`Raised from incident <a href="#" data-inc="${w.incidentId}">${esc(S.incidents[w.incidentId].no)} · ${esc(S.incidents[w.incidentId].title)}</a>${w.capaId&&(S.incidents[w.incidentId].capa||[]).find(c=>c.cid===w.capaId)?' for action: <b>'+esc(S.incidents[w.incidentId].capa.find(c=>c.cid===w.capaId).action)+'</b>':''}`:'Raised from an incident record (restricted to people with incident access).'}</div>`:''}

function bulkSet(){
  const ids=[...S.sel].filter(i=>S.assets[i]);if(!ids.length)return;
  const fields=[{k:'dept',label:'Department',type:'select',opts:()=>S.settings.departments,req:true},{k:'location',label:'Location / room',type:'locsel',deptField:'dept'},{k:'date',label:'Date',type:'date',req:true}];
  formSheet({title:`Set department & location · ${ids.length} asset(s)`,fields,data:{date:today()},extra:`<p class="muted" style="margin:0">Assets that already had a department or location get a location-history entry. Leave location blank to keep each asset's current room.</p>`,onSave:async v=>{
    let done=0;const err=$('#ferr');
    for(const id of ids){const a=S.assets[id];if(!a)continue;
      const toLoc=v.location||a.location||'';
      if(a.dept===v.dept&&(a.location||'')===toLoc){done++;continue}
      const had=a.dept||a.location;const next={...a,dept:v.dept,location:toLoc};
      if(had)next.moves=[...(a.moves||[]),{date:v.date,fromDept:a.dept||'',fromLoc:a.location||'',toDept:v.dept,toLoc,fromUser:a.assignedTo||'',toUser:a.assignedTo||'',reason:'Bulk update',at:new Date().toISOString(),...({by:S.me.id,name:S.me.name})}].slice(-100);
      try{await put('assets',id,next,(had?'Moved ':'Department / location set: ')+(had?[a.dept,a.location].filter(Boolean).join(' · ')+' → ':'')+[v.dept,toLoc].filter(Boolean).join(' · ')+' (bulk)')}
      catch(e){return`Stopped after ${done} of ${ids.length}: ${e.message||'save failed'}. Press Save to continue with the rest.`}
      done++;S.sel.delete(id);if(done%10===0&&err){err.hidden=false;err.style.color='var(--muted)';err.textContent=`Saving… ${done} of ${ids.length}`}
    }
    S.sel.clear();toast(`${done} asset(s) updated`);renderList();
  }});
}

function woForm(id,preset={}){
  const prev=id?S.workorders[id]:null;
  const data=prev||{type:'Breakdown / repair',status:'Open',priority:'Normal',reportDate:today(),performedBy:'',...preset};
  let lines=(prev?.lines||[]).map(l=>({...l}));
  const link=prev?{}:{incidentId:preset.incidentId||'',capaId:preset.capaId||''};
  const key=id||newId('workorders');let newFiles=[],upPending=0;
  const extra=()=>linesEditor(lines.length?lines:[])+`<div class="fgrid"><div class="sec">Attachments: service report, invoice, photos (optional)</div></div>${prev&&(prev.files||[]).length?`<p class="muted" style="margin:0">${prev.files.length} file(s) already attached; manage them on the job record.</p>`:''}<div class="toolbar" style="margin:0"><select id="wf_kind" style="width:auto" aria-label="Attachment type">${FILE_KINDS.workorders.map(k=>opt(k)).join('')}</select><label class="btn sm" for="wf_cam" style="cursor:pointer">Take photo</label><input id="wf_cam" class="wf-in" type="file" accept="image/*" capture="environment" hidden><label class="btn sm" for="wf_up" style="cursor:pointer">Attach PDF or photo</label><input id="wf_up" class="wf-in" type="file" multiple accept="image/*,application/pdf" hidden></div><div class="ev-list" id="wf_list"></div><p class="muted" style="margin:0;font-size:12px">PDF or photos up to 25 MB. Files are saved with the job when you click Save.</p>`+(prev?'':`<label class="check" for="f_markRepair" style="margin-top:4px"><input type="checkbox" id="f_markRepair" checked><span>Set the asset’s status to <b>Under repair</b> for breakdown jobs</span></label>`);
  const sh=formSheet({title:prev?'Update '+prev.no:'New work order',fields:F_WO,data,extra:extra(),
    danger:prev&&S.canAdmin?{label:'Delete job',onClick:()=>confirmBox('Delete '+prev.no+'?','The job, its compliance record and links to attachments will be removed. Spares already deducted are not returned to stock.','Delete',async()=>{await api('DELETE','/api/docs/workorders/'+id);delete S.workorders[id];closeLayer('drawer');renderList()})}:null,
    onSave:async v=>{
      if(upPending)return'Please wait for the attachment upload to finish.';
      lines=readLines();
      if(['Completed','Verified'].includes(v.status)&&!v.completedDate)return'Enter the date the work was completed.';
      if(v.status==='Verified'){
        const a=A(v.assetId);
        if(!v.verifiedBy)return'Enter who verified the job (QA / HOD).';
        if(a&&a.foodContact&&!(v.chkClearance&&v.chkTools))return'This is food-contact equipment. Confirm the foreign-matter check and hygiene clearance before verifying.';
        if(!v.verifiedDate)v.verifiedDate=today();
      }
      if(v.status==='Completed'&&!prev?.partsPosted){for(const l of lines){const p=S.parts[l.partId];if(p&&num(l.qty)>num(p.qty))return`Only ${num(p.qty)} ${p.unit||''} of ${p.name} in store.`}}
      const next={...(prev||{}),...link,...v,lines,no:prev?.no||nextWONo()};if(newFiles.length)next.files=[...(prev?.files||[]),...newFiles];if(!next.incidentId)delete next.incidentId;if(!next.capaId)delete next.capaId;
      const finishing=['Completed','Verified'].includes(next.status);
      // deduct spares once, when the job is first completed
      if(finishing&&!next.partsPosted&&lines.length){
        for(const l of lines){if(!S.parts[l.partId])continue;
          const r=await api('POST','/api/stock/'+l.partId,{type:'Issue',delta:-num(l.qty),date:next.completedDate||today(),ref:next.no,note:A(next.assetId)?.code||woWhere(next)});S.parts[l.partId]=r.doc}
        next.partsPosted=true;
      }
      const act=(prev?diffAct(prev,next,F_WO)+((JSON.stringify(prev.lines||[])!==JSON.stringify(lines))?'; spares list':''):'Created '+next.no+' ('+next.type+')'+(next.incidentId&&S.incidents[next.incidentId]?' from incident '+S.incidents[next.incidentId].no:''))+(newFiles.length?'; attached '+newFiles.map(f=>f.kind+': '+f.name).join(', '):'');
      await put('workorders',key,next,act);
      // asset side effects
      const a=A(next.assetId);
      if(a){const upd={};const why=[];
        if(!prev&&next.type==='Breakdown / repair'&&$('#f_markRepair')?.checked!==false&&a.status==='Active'&&!finishing){upd.status='Under repair';why.push('Status Active → Under repair')}
        if(finishing&&!(prev&&['Completed','Verified'].includes(prev.status))){
          if(a.status==='Under repair'){upd.status='Active';why.push('Status Under repair → Active')}
          if(next.type==='Preventive maintenance'&&next.completedDate&&(!a.lastPM||next.completedDate>a.lastPM)){upd.lastPM=next.completedDate;why.push('Last PM '+fmtD(next.completedDate))}
          if(next.type==='Calibration'&&next.completedDate&&a.calibInterval){upd.calibDue=addDays(next.completedDate,a.calibInterval);why.push('Calibration due '+fmtD(upd.calibDue))}
        }
        if(why.length)await put('assets',next.assetId,{...a,...upd},'From '+next.no+': '+why.join('; '));
      }
      toast(prev?next.no+' updated':next.no+' created');renderList();if(prev)renderDetail();else openDetail('wo',key);
    }});
  const wl=$('#wf_list',sh);const drawWF=(up)=>{wl.innerHTML=newFiles.map((f,i)=>`<span class="evc"><a data-fp="${esc(f.id)}" href="#" target="_blank" rel="noopener" title="${esc(f.name)}">${esc(f.kind)}: ${esc(f.name)}</a><button type="button" class="wf-x" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button></span>`).join('')+(up?`<span class="evc up">Uploading ${esc(up)}…</span>`:'');fillFiles(wl)};
  wl.addEventListener('click',e=>{const x=e.target.closest('.wf-x');if(x){newFiles.splice(+x.dataset.i,1);drawWF()}});
  $$('.wf-in',sh).forEach(inp=>inp.onchange=async()=>{const kind=$('#wf_kind',sh).value;const list=[...inp.files];inp.value='';
    for(const f of list){upPending++;drawWF(f.name);try{const r=await uploadFile('workorders',key,f);newFiles.push({id:r.id,name:r.name,kind,ct:r.ct,size:r.size,at:new Date().toISOString(),by:S.me.name})}catch(err){toast(f.name+': '+err.message)}finally{upPending--;drawWF()}}});
  const asel=$('#f_assetId',sh);if(asel)asel.addEventListener('change',()=>{const a=A(asel.value);if(!a)return;
    const ds=$('#f_dept',sh),ls=$('#f_location',sh);
    if(ds&&a.dept&&!ds.value){ds.value=a.dept;ds.dispatchEvent(new Event('change'))}
    if(ls&&a.location&&(!ls.value||ls.value==='__new')){if(![...ls.options].some(o=>o.value===a.location))ls.insertAdjacentHTML('afterbegin',`<option value="${esc(a.location)}">${esc(a.location)}</option>`);ls.value=a.location}});
  if(!prev&&preset.incidentId&&S.incidents[preset.incidentId]){const n=document.createElement('p');n.className='muted';n.style.margin='0';n.textContent='Repair job for incident '+S.incidents[preset.incidentId].no+'. Machine and location are optional.';$('form',sh).prepend(n)}
  const bindLines=()=>{
    $$('#lines .lx',sh).forEach(b=>b.onclick=()=>{b.closest('.line').remove()});
    $$('#lines .lp,#lines .lq',sh).forEach(el=>el.oninput=()=>{const r=el.closest('.line');const p=S.parts[$('.lp',r).value];$('.lc',r).textContent=p?rm(num($('.lq',r).value)*num(p.unitCost)):''});
  };
  const al=$('#addLine',sh);if(al)al.onclick=()=>{$('#lines',sh).insertAdjacentHTML('beforeend',lineRow({partId:'',qty:1,unitCost:0}));bindLines()};
  const np=$('#newPart',sh),nb=$('#newPartBtn',sh);
  if(nb)nb.onclick=()=>{np.hidden=false;nb.hidden=true;$('#np_code',sh).focus()};
  if(np){$('#np_cancel',sh).onclick=()=>{np.hidden=true;nb.hidden=false};
    $('#np_save',sh).onclick=async()=>{const err=$('#np_err',sh);err.hidden=true;const g=k=>$('#np_'+k,sh).value.trim();
      const code=g('code'),name=g('name'),qty=num(g('qty')),use=num(g('use'));
      const fail=m=>{err.textContent=m;err.hidden=false};
      if(!code||!name)return fail('Enter the part code and name.');
      if(Object.values(S.parts).some(p=>String(p.code).toLowerCase()===code.toLowerCase()))return fail('Part code '+code+' already exists. Use “Add spare part” to pick it.');
      if(use>0&&qty<use)return fail('Quantity bought / in store must be at least the quantity used on this job.');
      const key=newId('parts');const part={code,name,unit:g('unit'),unitCost:g('cost')===''?'':num(g('cost')),qty,minQty:'',moves:qty?[{date:today(),type:'Opening stock',qty,bal:qty,by:S.me.id,name:S.me.name,at:new Date().toISOString()}]:[]};
      const b=$('#np_save',sh);b.disabled=true;
      try{await put('parts',key,part,'Created from work order form');}catch(e){b.disabled=false;return fail(e.message||'Could not save the part.')}
      b.disabled=false;
      $$('#lines .lp',sh).forEach(sel=>{if(!sel.querySelector(`option[value="${key}"]`))sel.insertAdjacentHTML('beforeend',`<option value="${key}">${esc(code)} · ${esc(name)} (${qty} ${esc(part.unit||'')})</option>`)});
      if(use>0){$('#lines',sh).insertAdjacentHTML('beforeend',lineRow({partId:key,qty:use,unitCost:num(part.unitCost)}));bindLines()}
      ['code','name','unit','cost','qty'].forEach(k=>$('#np_'+k,sh).value='');$('#np_use',sh).value='1';np.hidden=true;nb.hidden=false;if(al)al.hidden=false;toast(name+' added to Spares & consumables');
    }}
  bindLines();
  // suggest contractor's name when contractor chosen
  const ps=$('#f_supplierId',sh),pb=$('#f_performedBy',sh);if(ps&&pb)ps.onchange=()=>{if(ps.value&&!pb.value)pb.value='External contractor / vendor'};
}

async function save(filename,data){

}

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const toISO=s=>{s=String(s||'').trim();if(!s)return'';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);return''};

  $('#tpl').onclick=()=>save('GFB_Asset_Import_Template.csv','﻿'+IMPORT_COLS.join(',')+'\r\n');
  $('#csvf').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;const rows=parseCSV(await file.text());if(rows.length<2){$('#imp').innerHTML='<p class="err">No data rows found.</p>';return}
    const h=rows[0].map(x=>x.trim().toLowerCase().replace(/\s+/g,'_'));const ix=k=>h.indexOf(k);
    if(ix('code')<0||ix('name')<0){$('#imp').innerHTML='<p class="err">The file needs at least “code” and “name” columns.</p>';return}
    const g=(r,k)=>ix(k)>=0?String(r[ix(k)]||'').trim():'';
    const have=new Set(Object.values(S.assets).map(a=>String(a.code).toLowerCase()));let added=0,skipped=0;
    $('#imp').innerHTML='<p class="muted">Importing…</p>';
    for(const r of rows.slice(1)){
      const code=g(r,'code'),name=g(r,'name');if(!code||!name||have.has(code.toLowerCase())){skipped++;continue}
      const iv=g(r,'pm_interval_days');
      const a={code,name,category:g(r,'category'),dept:g(r,'department'),location:g(r,'location'),status:ASSET_STATUS.includes(g(r,'status'))?g(r,'status'):'Active',criticality:g(r,'criticality'),foodContact:/^(y|yes|true|1)$/i.test(g(r,'food_contact')),manufacturer:g(r,'manufacturer'),model:g(r,'model'),serial:g(r,'serial'),purchaseDate:toISO(g(r,'purchase_date')),warrantyUntil:toISO(g(r,'warranty_until')),assignedTo:g(r,'assigned_to'),pmInterval:iv?String(parseInt(iv)||''):'',lastPM:toISO(g(r,'last_pm')),calibInterval:'',notes:g(r,'notes')};
      try{await put('assets',newId('assets'),a,'Imported from CSV');have.add(code.toLowerCase());added++}catch(err){break}
    }
    try{await addLocations(Object.values(S.assets).filter(a=>a.location).map(a=>({name:a.location,dept:a.dept})))}catch(e){}
    $('#imp').innerHTML=`<p><b>${added}</b> asset(s) imported${skipped?`, ${skipped} row(s) skipped (blank or code already exists)`:''}.</p>`;renderList();
  };
}

/* ---------- incidents & accidents (NADOPOD Regulations 2004 / PERKESO) ---------- */
const INC_CATS=['Accident – injury','Dangerous occurrence','Occupational poisoning','Occupational disease','Near miss','Property / equipment damage only'];
const INC_SEV=['Fatal','Serious bodily injury (Schedule 1)','Lost time – more than 4 days','Lost time – 4 days or less','Medical treatment, no lost time','First aid only','No injury'];
const INC_STATUS=['Reported','Under investigation','Action pending','Closed'];
const PERSON_TYPES=['Employee','Foreign worker (employee)','Contractor','Visitor','Self-employed'];
const hasPerson=i=>['Accident – injury','Occupational poisoning','Occupational disease'].includes(i.category);
const lostTime=i=>i.category==='Accident – injury'&&(i.severity==='Fatal'||!!i.deathDate||i.severity==='Serious bodily injury (Schedule 1)'||i.severity==='Lost time – more than 4 days'||i.severity==='Lost time – 4 days or less'||num(i.daysLost)>0);
function doshInfo(i){
  const c=i.category,s=i.severity,acc=c==='Accident – injury';
  const immediate=c==='Dangerous occurrence'||(acc&&(s==='Fatal'||s==='Serious bodily injury (Schedule 1)'));
  const written=immediate||(acc&&!!i.deathDate)||(acc&&s==='Lost time – more than 4 days')||c==='Occupational poisoning'||c==='Occupational disease';
  const form=(c==='Occupational poisoning'||c==='Occupational disease')?'JKKP 7':'JKKP 6';
  const days=num(S.settings.dosh&&S.settings.dosh.reportDays)||7;
  return{immediate,written,form,days,due:written&&i.incDate?addDays(i.incDate,days):''};
}
function perkesoInfo(i){
  const need=hasPerson(i)&&['Employee','Foreign worker (employee)'].includes(i.personType)&&!!i.severity&&i.severity!=='No injury';
  const hrs=num(S.settings.dosh&&S.settings.dosh.perkesoHours)||48;
  let dueAt='';if(need&&i.incDate){const d=new Date(i.incDate+'T'+(i.incTime||'00:00'));d.setHours(d.getHours()+hrs);dueAt=d.toISOString()}
  return{need,hrs,dueAt};
}
function doshPill(i){const d=doshInfo(i);if(!d.written)return'<span class="pill">Not notifiable to DOSH</span>';
  if(i.doshReportDate)return`<span class="pill ok">${d.form} sent ${fmtD(i.doshReportDate)}</span>`;
  const left=dayDiff(today(),d.due);return`<span class="pill ${left<0?'bad':left<=2?'warn':'info'}">${d.form} ${left<0?Math.abs(left)+' d overdue':'due '+fmtD(d.due)}</span>`}
function perkesoPill(i){const p=perkesoInfo(i);if(!p.need)return'';if(i.perkesoDate)return`<span class="pill ok">Borang 34 sent ${fmtD(i.perkesoDate)}</span>`;
  const late=Date.now()>new Date(p.dueAt).getTime();return`<span class="pill ${late?'bad':'warn'}">Borang 34 ${late?'overdue':'due '+fmtDT(p.dueAt)}</span>`}
const incPending=i=>i.status!=='Closed'&&((doshInfo(i).immediate&&!i.doshNotifiedAt)||(doshInfo(i).written&&!i.doshReportDate)||(perkesoInfo(i).need&&!i.perkesoDate));
const sevPill=i=>hasPerson(i)?`<span class="pill ${({'Fatal':'bad','Serious bodily injury (Schedule 1)':'bad','Lost time – more than 4 days':'bad','Lost time – 4 days or less':'warn','Medical treatment, no lost time':'warn'})[i.severity]||''}">${esc(i.severity||'Severity not set')}</span>`:`<span class="pill ${i.category==='Dangerous occurrence'?'bad':''}">${esc(i.category)}</span>`;
const incStatusPill=s=>`<span class="pill ${({'Reported':'bad','Under investigation':'warn','Action pending':'warn','Closed':'ok'})[s]||''}">${esc(s||'Reported')}</span>`;
const incWhen=i=>fmtD(i.incDate)+(i.incTime?' '+i.incTime:'');

function nextIncNo(){
  const d=new Date();const pre='INC-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+'-';
  const max=Object.values(S.incidents).filter(i=>String(i.no).startsWith(pre)).reduce((m,i)=>Math.max(m,parseInt(String(i.no).slice(pre.length))||0),0);
  return pre+String(max+1).padStart(3,'0');
}
function evChips(ev,edit){return(ev||[]).map((f,i)=>`<span class="evc"><a data-fp="${esc(f.id)}" href="#" target="_blank" rel="noopener" title="${esc(f.name)}">${String(f.ct).startsWith('image/')?'Photo':'PDF'}: ${esc(f.name)}</a>${edit?`<button type="button" class="ev-x" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button>`:''}</span>`).join('')}
function capaRow(c){return`<div class="capa" data-cid="${esc(c.cid||'')}" data-ev="${esc(JSON.stringify(c.evidence||[]))}"><input class="ca-a" type="text" aria-label="Action" placeholder="Corrective / preventive action" value="${esc(c.action)}"><input class="ca-o" type="text" aria-label="Owner" placeholder="Owner" value="${esc(c.owner)}"><input class="ca-d" type="date" aria-label="Due date" value="${esc(c.due)}"><select class="ca-s" aria-label="Status">${opt('Open',c.status||'Open')}${opt('Done',c.status)}</select><label class="btn sm ca-f" style="cursor:pointer" title="Attach photo or PDF as evidence (optional)">Attach<input class="ca-in" type="file" multiple accept="image/*,application/pdf" hidden aria-label="Attach evidence"></label><button type="button" class="btn sm ca-x" aria-label="Remove action">×</button><div class="ca-ev">${evChips(c.evidence,true)}</div></div>`}
function capaEditor(list){return`<div class="fgrid"><div class="sec">Corrective &amp; preventive actions (CAPA)</div></div><div class="lines" id="capa">${list.map(capaRow).join('')}</div><div><button type="button" class="btn sm" id="addCapa">Add action</button> <span class="muted" style="font-size:12px">Evidence (photo or PDF) is optional. Use Attach on each action.</span></div>`}
function readCapa(prev){return $$('#capa .capa').map((r,ix)=>{const s=$('.ca-s',r).value;const p=(prev||[])[ix]||{};return{cid:r.dataset.cid||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),action:$('.ca-a',r).value.trim(),owner:$('.ca-o',r).value.trim(),due:$('.ca-d',r).value,status:s,evidence:JSON.parse(r.dataset.ev||'[]'),doneDate:s==='Done'?(p.status==='Done'&&p.doneDate?p.doneDate:today()):''}}).filter(c=>c.action)}

function incForm(id,preset={}){
  const prev=id?S.incidents[id]:null;
  const data=prev||{category:'Accident – injury',incDate:today(),status:'Reported',reportedBy:S.me.name,...preset};
  const key=id||('inc-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));let evPending=0;
  const sh=formSheet({title:prev?'Update '+prev.no:'Report incident / accident',fields:F_INC,data,extra:capaEditor((prev&&prev.capa)||[]),
    danger:prev&&S.canAdmin?{label:'Delete record',onClick:()=>confirmBox('Delete '+prev.no+'?','DOSH requires every register entry to be kept for at least 5 years (NADOPOD Regulations 2004, reg. 10). Delete only a record entered by mistake.','Delete',async()=>{await api('DELETE','/api/docs/incidents/'+id);delete S.incidents[id];closeLayer('drawer');renderList()})}:null,
    onSave:async v=>{
      if(evPending)return'Please wait for the evidence upload to finish.';
      const caps=readCapa(prev&&prev.capa);
      if(hasPerson(v)&&!v.personName)return'Enter the name of the person involved.';
      if(v.category==='Accident – injury'&&!v.severity)return'Choose the severity of the injury.';
      const d=doshInfo(v),p=perkesoInfo(v);
      if(v.status==='Closed'){
        if(!v.investigatedBy)return'Enter who investigated before closing.';
        if(caps.some(c=>c.status!=='Done'))return'Complete all corrective actions before closing.';
        if(d.immediate&&!v.doshNotifiedAt)return'Record when the DOSH office was notified before closing.';
        if(d.written&&!v.doshReportDate)return`Record the date the ${d.form} report was submitted before closing.`;
        if(p.need&&!v.perkesoDate)return'Record the Borang 34 (PERKESO) submission before closing.';
        if(!v.closedDate)v.closedDate=today();
      }
      const next={...(prev||{}),...v,capa:caps,no:(prev&&prev.no)||nextIncNo()};
      const act=prev?diffAct(prev,next,F_INC)+(JSON.stringify(prev.capa||[])!==JSON.stringify(caps)?'; actions (CAPA)':''):'Reported '+next.no+' ('+next.category+(next.severity&&hasPerson(next)?', '+next.severity:'')+')';
      await put('incidents',key,next,act);
      toast(d.immediate&&!next.doshNotifiedAt?'Saved. Notify the nearest DOSH office now by phone or email.':(prev?next.no+' updated':next.no+' recorded'));
      renderList();if(prev)renderDetail();else openDetail('incident',key);
    }});
  if(!sh)return;
  const box=$('#capa',sh);
  const redraw=row=>{const ev=JSON.parse(row.dataset.ev||'[]');$('.ca-ev',row).innerHTML=evChips(ev,true)+(row._up?`<span class="evc up">Uploading ${row._up}…</span>`:'');fillFiles(row)};
  box.addEventListener('click',e=>{const x=e.target.closest('.ca-x');if(x){x.closest('.capa').remove();return}
    const r=e.target.closest('.ev-x');if(r){const row=r.closest('.capa');const ev=JSON.parse(row.dataset.ev||'[]');ev.splice(+r.dataset.i,1);row.dataset.ev=JSON.stringify(ev);redraw(row)}});
  box.addEventListener('change',async e=>{const inp=e.target.closest('.ca-in');if(!inp)return;const row=inp.closest('.capa');const list=[...inp.files];inp.value='';
    for(const f of list){evPending++;row._up=f.name;redraw(row);
      try{const res=await uploadFile('incidents',key,f);const ev=JSON.parse(row.dataset.ev||'[]');ev.push({id:res.id,name:res.name,ct:res.ct,size:res.size,at:new Date().toISOString(),by:S.me.name});row.dataset.ev=JSON.stringify(ev)}
      catch(err){toast(f.name+': '+err.message)}
      finally{evPending--;row._up='';redraw(row)}}});
  $('#addCapa',sh).onclick=()=>box.insertAdjacentHTML('beforeend',capaRow({status:'Open'}));
  fillFiles(box);
}

      ${['immediateAction','immediateCause','rootCause'].map(k=>i[k]?`<p style="margin:8px 0 0"><b>${({immediateAction:'Immediate action',immediateCause:'Immediate cause',rootCause:'Root cause'})[k]}:</b> ${esc(i[k])}</p>`:'').join('')}</div>

function summaryDoc(year,workers,hours){
