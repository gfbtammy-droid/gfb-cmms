<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const fmtD=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'—';
const fmtDT=iso=>{if(!iso)return'—';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+Number(n));return isoOf(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const byStr=k=>(a,b)=>String(a[1][k]||'').localeCompare(String(b[1][k]||''),undefined,{numeric:true});
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}

/* ---------- state ---------- */
const DEFAULTS={
  categories:['Production machine','Production equipment','Hand tools & power tools','Material handling (forklift / reach truck)','Utilities & facility','Air-conditioning','Computer & IT','Office equipment','QC lab / measuring instrument'],
  departments:['Production','Warehouse','QA / QC','Office / Admin','Facility / utilities'],
  locList:[['Mixing room','Production'],['Packing area','Production'],['Raw material store','Warehouse'],['Finished goods store','Warehouse'],['QC lab','QA / QC'],['General office','Office / Admin'],['Meeting room','Office / Admin'],['Server / IT room','Office / Admin']].map(([name,dept])=>({name,dept})),
  partCats:['Building & facilities','Machines & tools','Forklift & reach truck','Office equipment & IT']
};
const ASSET_STATUS=['Active','Under repair','Standby','Out of service','Disposed'];
const WO_TYPES=['Breakdown / repair','Preventive maintenance','Calibration','Inspection','Installation / modification'];
const WO_STATUS=['Open','In progress','Waiting parts','Completed','Verified'];
const PRIORITY=['Critical','High','Normal','Low'];
const INTERVALS=[['','No schedule'],['7','Weekly'],['14','Every 2 weeks'],['30','Monthly'],['60','Every 2 months'],['90','Quarterly'],['180','Half-yearly'],['365','Yearly']];
const S={assets:{},workorders:{},parts:{},suppliers:{},incidents:{},contracts:{},purchases:{},config:{},settings:{...DEFAULTS},view:'dash',f:{},detail:null,sel:new Set(),canWrite:false,canAdmin:false,me:null,seq:0,ready:false};
/* ---------- Supabase connection ---------- */
const CFG=window.GFB_CONFIG||{};
let sb=null;
function sbClient(){if(!sb){if(!window.supabase||!CFG.supabaseUrl||/YOUR-PROJECT|^\s*$/.test(CFG.supabaseUrl)||!CFG.supabaseAnonKey)return null;sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}return sb}
const ERR=(m,code,body)=>Object.assign(new Error(m),{code,body});
function sbErr(e){const m=(e&&e.message)||String(e);if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return ERR('Cannot reach the database. Check your internet connection.','offline');if(/JWT expired|invalid JWT|not authenticated|PGRST301/i.test(m+(e&&e.code||'')))return ERR('Please sign in again.',401);return ERR(m,(e&&e.code)||'error')}
async function rpc(fn,args){let res;try{res=await sb.rpc(fn,args)}catch(e){throw sbErr(e)}if(res.error){const x=sbErr(res.error);if(x.code===401){S.me=null;showLogin()}throw x}return res.data}
async function api(method,path,body){
  if(!sbClient())throw ERR('This copy is not connected to a database yet. Fill in config.js.','config');
  let m;
  if(path==='/api/status'){const {data:{session}}=await sb.auth.getSession();if(!session)return{user:null};let p;try{p=await rpc('my_profile',{})}catch(e){if(e.code===401)return{user:null};throw e}if(!p)return{user:null,orphan:true};
    return{user:{id:p.id,name:p.name||p.email,username:p.email,role:p.role,active:p.active,incidents:p.role==='admin'||!!p.incident_access,approver:!!p.can_approve&&!!p.active}}}
  if(path==='/api/login'){const {error}=await sb.auth.signInWithPassword({email:String(body.username||'').trim(),password:body.password||''});if(error)throw ERR(/invalid login/i.test(error.message)?'Wrong email or password.':/not confirmed/i.test(error.message)?'Confirm your email first: open the link Supabase sent you.':error.message,401);return{ok:true}}
  if(path==='/api/signup'){if(String(body.password||'').length<8)throw ERR('Use a password of at least 8 characters.',400);const {data,error}=await sb.auth.signUp({email:String(body.email||'').trim(),password:body.password,options:{data:{name:String(body.name||'').trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw ERR(error.message,400);return{ok:true,session:!!(data&&data.session)}}
  if(path==='/api/forgot'){const {error}=await sb.auth.resetPasswordForEmail(String(body.email||'').trim(),{redirectTo:location.origin+location.pathname});if(error)throw ERR(error.message,400);return{ok:true}}
  if(path==='/api/logout'){try{await sb.auth.signOut()}catch(e){}return{ok:true}}
  if(path==='/api/password'){if(body.current){const {data:{user}}=await sb.auth.getUser();const {error:e1}=await sb.auth.signInWithPassword({email:user.email,password:body.current});if(e1)throw ERR('Your current password is wrong.',400)}
    if(String(body.next||'').length<8)throw ERR('Use at least 8 characters.',400);const {error}=await sb.auth.updateUser({password:body.next});if(error)throw ERR(error.message,400);return{ok:true}}
  if((m=path.match(/^\/api\/sync\?since=(\d+)/))){const since=+m[1];const docs=[];
    for(let from=0;;from+=1000){const {data,error}=await sb.from('docs').select('coll,id,data,seq').gt('seq',since).order('seq').range(from,from+999);if(error)throw sbErr(error);docs.push(...data);if(data.length<1000)break}
    let deleted=[];if(since){const {data,error}=await sb.from('tombstones').select('coll,id,seq').gt('seq',since);if(error)throw sbErr(error);deleted=data}
    return{seq:Math.max(since,...docs.map(d=>+d.seq),...deleted.map(d=>+d.seq)),docs,deleted,full:!since}}

const MIME={'.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp','.gif':'image/gif','.heic':'image/heic','.pdf':'application/pdf'};
async function uploadFile(coll,id,file){
  const ext=((file.name||'').match(/\.[A-Za-z0-9]+$/)||[''])[0].toLowerCase();
  const ct=/^(image\/(jpeg|png|webp|gif|heic)|application\/pdf)$/.test(file.type)?file.type:(MIME[ext]||file.type||'');
  if(!/^(image\/(jpeg|png|webp|gif|heic)|application\/pdf)$/.test(ct))throw ERR('Only PDF files and photos (JPG, PNG, WebP, HEIC) can be attached. Save Word or Excel reports as PDF first.',400);
  if(file.size>25*1048576)throw ERR('The file is over 25 MB.',400);
  const name=file.name||('photo-'+Date.now()+'.jpg');
  const path=`${coll}/${id}/${Date.now().toString(36)}-${name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80)}`;
  const {error}=await sb.storage.from('attachments').upload(path,file,{contentType:ct,upsert:false});
  if(error)throw ERR(/row-level security|not authorized|unauthorized/i.test(error.message)?'You do not have permission to upload here.':error.message,400);
  return{id:path,name,ct,size:file.size};
}

/* ---------- shell / navigation ---------- */
const ALLVIEWS=[['dash','Overview'],['wos','Work orders'],['incidents','Incidents'],['pm','PM'],['cal','Calibration'],['contracts','Contracts'],['assets','Assets'],['parts','Part & Consumables'],['purchases','Purchasing'],['suppliers','Contractors'],['activity','Activity'],['settings','Settings'],['users','Users']];
let VIEWS=ALLVIEWS.filter(v=>v[0]!=='users');
function counts(){
  const as=Object.values(S.assets);
  return{
    overdue:as.filter(a=>pmInfo(a)?.state==='overdue').length,
    open:Object.values(S.workorders).filter(openWO).length,
    low:Object.values(S.parts).filter(lowStock).length,
    renew:Object.values(S.contracts).filter(conDue).length,
    cal:Object.values(S.assets).filter(calOverdue).length,
    pur:Object.values(S.purchases).filter(p=>p.status==='Pending approval').length
  };
}
function renderTabs(){
  const c=counts();const badge={pm:c.overdue,wos:c.open,parts:c.low,contracts:c.renew,cal:c.cal,purchases:c.pur};
  $('#tabs').innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}" aria-current="${S.view===k}">${l}${badge[k]?`<span class="n">${badge[k]}</span>`:''}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v,filters){S.view=v;if(filters)S.f[v]={...(S.f[v]||{}),...filters};try{localStorage.setItem('gfb_view',v)}catch(e){}renderShell();window.scrollTo(0,0)}
function renderShell(){
  renderTabs();
  const V=VIEW[S.view];
  $('#main').innerHTML=(S.canWrite?'':'<div class="banner">Your account is view-only. Ask an admin to make you an Editor to add or update records.</div>')+V.shell();
  if(V.bind)V.bind();renderList();
}
function renderList(){const el=$('#list');if(el){el.innerHTML=VIEW[S.view].list();if(S.view==='settings')bindLocations(el);if(S.view==='assets')bindBulk(el);$$('[data-calrow]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const[i,k]=b.dataset.calrow.split('|');calRecord(i,k)});bindRows(el);fillNames(el);
  const d=$('#dAdd',el);if(d)d.onclick=()=>assetForm();
  $$('[data-eu]',el).forEach(b=>b.onclick=()=>userForm(b.dataset.eu));
  $$('[data-pm]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const a=A(b.dataset.pm);woForm(null,{assetId:b.dataset.pm,type:'Preventive maintenance',title:'Scheduled preventive maintenance',tasksDone:a?.pmTasks||''})})}renderTabs()}
function bindRows(root){$$('[data-open]',root).forEach(r=>r.onclick=e=>{if(e.target.closest('button,a,input'))return;const[k,id]=r.dataset.open.split(':');openDetail(k,id)});
  $$('[data-go]',root).forEach(b=>b.onclick=()=>{const[v,f,val]=b.dataset.go.split('|');go(v,f?{[f]:val}:null)})}
const W=fn=>S.canWrite?fn():'';
const fval=(v,k,d='')=>(S.f[v]&&S.f[v][k])??d;
function bindFilters(v){$$('[data-f]').forEach(el=>{const h=()=>{S.f[v]={...(S.f[v]||{}),[el.dataset.f]:el.value};renderList()};if(el.tagName==='SELECT'||el.type==='date')el.onchange=h;else el.oninput=h})}
const match=(q,...xs)=>!q||xs.join(' ').toLowerCase().includes(q.toLowerCase());
const emptyRow=(cols,title,msg)=>`<tr><td colspan="${cols}"><div class="empty"><b>${title}</b>${msg}</div></td></tr>`;

const VIEW={};
VIEW.dash={shell:()=>'<div id="list"></div>',list(){
  const as=Object.entries(S.assets),ws=Object.entries(S.workorders),ps=Object.entries(S.parts),ss=Object.entries(S.suppliers);
  if(!as.length&&!ws.length){
    return`<div class="panel" style="margin-top:22px"><div class="empty"><b>No assets registered yet</b>Start with your machine list. Add items one by one, or import a CSV (Asset register → Import CSV) for production machines, forklifts, office aircon units and computers.<div class="acts" style="justify-content:center;margin-top:14px">${W(()=>'<button class="btn pri" id="dAdd">Add first asset</button>')}<button class="btn" data-go="assets">Go to asset register</button></div></div></div>`;
  }
  const pm=as.map(([id,a])=>[id,a,pmInfo(a)]).filter(x=>x[2]);
  const overdue=pm.filter(x=>x[2].state==='overdue'),soon=pm.filter(x=>x[2].state==='soon'),unset=pm.filter(x=>x[2].state==='unset');
  const open=ws.filter(([,w])=>openWO(w)),toVerify=ws.filter(([,w])=>w.status==='Completed');
  const low=ps.filter(([,p])=>lowStock(p));const down=as.filter(([,a])=>a.status==='Under repair');
  const watch=[];
  as.forEach(([id,a])=>{const w=dateWatch(a.warrantyUntil);if(w&&w.state!=='ok'&&w.days>-30)watch.push(['asset:'+id,a.code+' · '+a.name,'Warranty',w,a.warrantyUntil]);
    const c=dateWatch(a.calibDue);if(c&&c.state!=='ok'&&a.status!=='Disposed')watch.push(['asset:'+id,a.code+' · '+a.name,'Calibration',c,a.calibDue])});
  ss.forEach(([id,s])=>{const w=dateWatch(s.evalDue);if(w&&w.state!=='ok')watch.push(['supplier:'+id,s.name,'Supplier evaluation',w,s.evalDue])});
  Object.entries(S.contracts).forEach(([id,c])=>{const i=conInfo(c);if(i&&(i.state==='soon'||i.state==='expired'))watch.push(['contract:'+id,c.title,'Contract renewal',{days:i.days,state:i.state==='expired'?'overdue':'soon'},c.endDate])});
  watch.sort((a,b)=>a[3].days-b[3].days);
  const now=new Date();const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push([d.getFullYear()+'-'+pad(d.getMonth()+1),d.toLocaleString('en-MY',{month:'short'})])}
  const mcost=months.map(([k,l])=>[l,ws.filter(([,w])=>woDate(w).startsWith(k)).reduce((s,[,w])=>s+woCost(w),0)]);
  const max=Math.max(1,...mcost.map(m=>m[1]));
  const ytdStart=(now.getMonth()>=6?now.getFullYear():now.getFullYear()-1)+'-07-01';
  const ytd=ws.filter(([,w])=>woDate(w)>=ytdStart).reduce((s,[,w])=>s+woCost(w),0);
  const tile=(cls,n,l,go)=>`<button type="button" class="tile ${n?cls:'ok'}" data-go="${go}"><span class="lbl">${l}</span><b>${n}</b></button>`;
  const sortedPM=[...overdue,...soon].sort((a,b)=>a[2].days-b[2].days).slice(0,8);
  return`<div class="tiles">
    ${tile('bad',overdue.length,'PM overdue','pm|state|overdue')}
    ${tile('warn',soon.length,'PM due in 14 days','pm|state|soon')}
    ${tile('bad',open.length,'Open work orders','wos|status|open')}
    ${tile('warn',toVerify.length,'Awaiting QA verification','wos|status|Completed')}
    ${tile('bad',down.length,'Machines under repair','assets|status|Under repair')}
    ${tile('warn',low.length,'Parts at re-order level','parts|low|1')}
    ${tile('warn',Object.values(S.purchases).filter(p=>p.status==='Pending approval').length,'Purchase requests awaiting approval','purchases|state|pending')}
    ${tile('warn',Object.values(S.contracts).filter(conDue).length,'Contract renewals due','contracts|state|due')}
    ${tile('warn',Object.values(S.assets).filter(calDue).length,'Calibration due / out of tolerance','cal|state|due')}
    ${S.me&&S.me.incidents?tile('bad',Object.values(S.incidents).filter(i=>i.status!=='Closed').length,'Open incidents','incidents|status|open')+tile('bad',Object.values(S.incidents).filter(incPending).length,'DOSH / PERKESO reports due','incidents|status|due'):''}
  </div>
  <div class="grid2">
    <div class="panel"><h3>Preventive maintenance due</h3>${sortedPM.length?`<div class="tbl-wrap"><table><thead><tr><th>Asset</th><th class="hs">Department · location</th><th>Due</th><th></th></tr></thead><tbody>${sortedPM.map(([id,a,i])=>`<tr data-open="asset:${id}"><td><span class="mono">${esc(a.code)}</span><br>${esc(a.name)}${a.foodContact?'<span class="fc">FC</span>':''}</td><td class="hs">${esc(place(a)||'—')}</td><td>${pmPill(i)}</td><td class="r">${W(()=>`<button class="btn sm" data-pm="${id}">Log PM</button>`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Nothing due in the next 14 days</b>${unset.length?`${unset.length} scheduled asset(s) still need a last-PM date.`:'All scheduled assets are up to date.'}</div>`}</div>
    <div class="panel"><h3>Open jobs</h3>${open.length?`<div class="tbl-wrap"><table><thead><tr><th>WO</th><th>Asset / problem</th><th>Status</th></tr></thead><tbody>${open.sort((a,b)=>PRIORITY.indexOf(a[1].priority)-PRIORITY.indexOf(b[1].priority)).slice(0,8).map(([id,w])=>`<tr data-open="wo:${id}"><td class="mono">${esc(w.no)}<br>${prPill(w.priority)}</td><td>${esc(woWhat(w))}<br><span class="muted">${esc(w.title)}</span></td><td>${woPill(w.status)}<br><span class="muted">${fmtD(w.reportDate)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No open jobs</b>Breakdowns and requests you log will show here until QA verifies them.</div>'}</div>
    <div class="panel"><h3>Maintenance spend</h3><div class="muted">Invoices + internal labour + spares issued. FY from 1 July: <b class="num" style="color:var(--ink)">${rm(ytd)}</b></div>
      <div class="bars">${mcost.map(([l,v])=>`<div class="bar"><em>${v?Math.round(v).toLocaleString('en-MY'):''}</em><i style="height:${Math.max(1.5,v/max*100)}%"></i><span>${l}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>Watch list</h3>${watch.length||low.length?`<div class="tbl-wrap"><table><tbody>${watch.slice(0,8).map(([o,n,t,w,d])=>`<tr data-open="${o}"><td>${esc(n)}<br><span class="muted">${t} · ${fmtD(d)}</span></td><td class="r">${watchPill(w)}</td></tr>`).join('')}${low.slice(0,6).map(([id,p])=>`<tr data-open="part:${id}"><td>${esc(p.name)}<br><span class="muted">Spare · re-order level ${esc(p.minQty)} ${esc(p.unit||'')}</span></td><td class="r"><span class="pill ${num(p.qty)<=0?'bad':'warn'}">${num(p.qty)} ${esc(p.unit||'')} left</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>All clear</b>Warranty, calibration and supplier-evaluation dates within 30 days, and low spares, appear here.</div>'}</div>
  </div>`;
},};

  shell:()=>`<h2>Part &amp; Consumables</h2><div class="toolbar">
    <input class="grow" type="search" data-f="q" id="q_s" placeholder="Search part code, name, asset…" value="${esc(fval('parts','q'))}">

  bind(){bindFilters('parts');const a=$('#addP');if(a)a.onclick=()=>partForm();const pl=$('#prLow');if(pl)pl.onclick=()=>{const L=Object.entries(S.parts).filter(([pid,p])=>lowStock(p)&&onOrderQty(pid)<=0).sort(byStr('code'));if(!L.length){toast('No parts at re-order level without an open PO.');return}purForm(null,{purpose:'Re-order spares at or below re-order level',lines:L.map(([pid,p])=>({partId:pid,desc:p.code+' · '+p.name,qty:Math.max(1,num(p.minQty)*2-num(p.qty)),unit:p.unit||'',price:p.unitCost??''})),supplierId:L[0][1].supplierId||''})};$('#expP').onclick=()=>exportCSV('parts')},
  list(){
    const q=fval('parts','q'),c=fval('parts','cat'),lo=fval('parts','low');
    const rows=Object.entries(S.parts).filter(([,p])=>(!c||p.category===c)&&(!lo||lowStock(p))&&match(q,p.code,p.name,p.compatible,p.store)).sort(byStr('code'));
    const val=rows.reduce((s,[,p])=>s+num(p.qty)*num(p.unitCost),0);
    return`<div class="tbl-wrap"><table><thead><tr><th class="hs">Code</th><th>Item</th><th class="hs">Category · store</th><th class="r">On hand</th><th class="r hs">On order</th><th class="r hs">Re-order at</th><th class="r hs">Value</th></tr></thead><tbody>${rows.length?rows.map(([id,p])=>`<tr data-open="part:${id}"><td class="mono hs">${esc(p.code)}</td><td><span class="so mono muted">${esc(p.code)}<br></span>${esc(p.name)}${p.foodGrade?'<span class="fc">FOOD-GRADE</span>':''}<br><span class="muted">${esc(p.compatible||'')}</span></td><td class="hs">${esc(p.category||'—')}<br><span class="muted">${esc(p.store||'')}</span></td><td class="r num"><span class="dot ${lowStock(p)?(num(p.qty)<=0?'bad':'warn'):'ok'}"></span>${num(p.qty)} ${esc(p.unit||'')}</td><td class="r num hs">${(()=>{const o=onOrderQty(id);return o?o:'—'})()}</td><td class="r num hs">${p.minQty===''||p.minQty==null?'—':esc(p.minQty)}</td><td class="r num hs">${rm(num(p.qty)*num(p.unitCost))}</td></tr>`).join(''):emptyRow(7,'No spares or consumables','Add parts you keep in store: bearings, belts, seals, filters, food-grade grease, fuses, toner.')}</tbody></table></div><p class="muted" style="margin-top:8px">${rows.length} item(s) · stock value ${rm(val)}</p>`;
  }};

VIEW.activity={
  shell:()=>`<h2>Activity log</h2><p class="muted" style="margin-top:-4px">Every create and change, with who did it and when. Each record keeps its last 60 changes.</p><div class="toolbar"><input class="grow" type="search" data-f="q" id="q_l" placeholder="Search…" value="${esc(fval('activity','q'))}"></div><div id="list"></div>`,
  bind(){bindFilters('activity')},
  list(){
    const q=fval('activity','q');const ev=[];
    const lab={assets:['asset',r=>r.code+' · '+r.name],workorders:['wo',r=>(r.no||'Draft')+' · '+woWhat(r)],parts:['part',r=>r.code+' · '+r.name],suppliers:['supplier',r=>r.name],incidents:['incident',r=>(r.no||'Draft')+' · '+r.title],contracts:['contract',r=>r.title],purchases:['purchase',r=>(r.poNo||r.no||'Draft')+' · '+String(r.purpose||'').split('\n')[0]]};
    COLLS.forEach(c=>Object.entries(S[c]).forEach(([id,r])=>(r.history||[]).forEach(h=>ev.push([h,c,id,lab[c][1](r)]))));
    const rows=ev.filter(([h,,,n])=>match(q,h.act,n)).sort((a,b)=>String(b[0].at).localeCompare(String(a[0].at))).slice(0,300);

    return`<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th class="hs">Record</th><th>Change</th></tr></thead><tbody>${rows.length?rows.map(([h,c,id,n])=>`<tr data-open="${lab[c][0]}:${id}"><td class="num" style="white-space:nowrap">${fmtDT(h.at)}</td><td>${who(h)}</td><td class="hs"><span class="pill">${kind[c]}</span><br>${esc(n)}</td><td>${esc(h.act)}<span class="muted" style="display:block">${esc(n)}</span></td></tr>`).join(''):emptyRow(4,'No activity yet','Changes appear here as your team records them.')}</tbody></table></div>`;
  }};

VIEW.settings={
  shell:()=>`<div id="list"></div><h2>Lists used in forms</h2><p class="muted" style="margin-top:-4px">One item per line. Renaming an item does not change records already saved.${S.canAdmin?'':' Only an admin can change these lists.'}</p>
   <div class="grid2">${[['categories','Asset categories'],['departments','Departments'],['partCats','Spare-part categories']].map(([k,l])=>`<div class="panel"><div class="field"><label for="set_${k}">${l}</label><textarea id="set_${k}" style="min-height:200px"${S.canAdmin?'':' readonly'}>${esc((S.settings[k]||[]).join('\n'))}</textarea></div></div>`).join('')}</div>
   ${S.canAdmin?'<div class="acts" style="margin-top:12px"><button class="btn pri" id="saveSet">Save lists</button></div>':''}
   <h2>Part &amp; consumable codes</h2><div class="panel"><p class="muted" style="margin:0 0 10px">New parts get an automatic running number by category, e.g. <span class="mono">${esc(partPrefix(S.settings.partCats[0]))}-0001</span>. Change a prefix here (2 to 5 letters or digits). Existing parts keep their codes; anyone can still type their own code when adding a part.</p>
     <div class="fgrid">${S.settings.partCats.map((c,i)=>`<div class="field"><label for="pp_${i}">${esc(c)}</label><input id="pp_${i}" data-cat="${esc(c)}" type="text" maxlength="5" value="${esc(partPrefix(c))}"${S.canAdmin?'':' readonly'}><span class="muted" style="font-size:12px">Next: <span class="mono">${esc(nextPartCode(c))}</span></span></div>`).join('')}</div>
     ${S.canAdmin?'<div class="acts" style="margin-top:12px"><button class="btn" id="savePP">Save code prefixes</button></div>':''}</div>
   <h2>Reporting deadlines</h2><div class="panel"><p class="muted" style="margin:0 0 10px">Used by the incident register. The DOSH written report is 7 days under the NADOPOD Regulations 2004. Confirm the PERKESO Borang 34 deadline with PERKESO or your HR SOP.</p>
     <div class="fgrid"><div class="field"><label for="set_doshDays">DOSH written report due (days after incident)</label><input id="set_doshDays" type="number" value="${esc(S.settings.dosh.reportDays)}"${S.canAdmin?'':' readonly'}></div><div class="field"><label for="set_perkesoH">PERKESO Borang 34 due (hours after incident)</label><input id="set_perkesoH" type="number" value="${esc(S.settings.dosh.perkesoHours)}"${S.canAdmin?'':' readonly'}></div></div>
     ${S.canAdmin?'<div class="acts" style="margin-top:12px"><button class="btn" id="saveDosh">Save deadlines</button></div>':''}</div>
   <h2>Calibration</h2><div class="panel"><p class="muted" style="margin:0 0 10px">How early an external calibration or stamping date turns amber (Calibration tab, Overview tile and the “due” filter), and how readings are judged against tolerance.</p>
     <div class="fgrid"><div class="field"><label for="set_calLead">Remind before external calibration / stamping (days)</label><input id="set_calLead" type="number" min="1" value="${esc(S.settings.cal.lead)}"${S.canAdmin?'':' readonly'}></div>
     <div class="field" style="grid-column:span 2"><label for="set_calRule">Pass / fail rule</label><select id="set_calRule"${S.canAdmin?'':' disabled'}>${opt(['error','Error within tolerance (uncertainty not counted)'],S.settings.cal.rule)}${opt(['errU','Error + measurement uncertainty within tolerance (stricter)'],S.settings.cal.rule)}</select></div></div>
     <p class="muted" style="margin:6px 0 0">Uncertainty is optional per check point: copy the ± value from the certificate. With the stricter rule a point passes only when |error| + uncertainty ≤ tolerance.</p>
     ${S.canAdmin?'<div class="acts" style="margin-top:12px"><button class="btn" id="saveCal">Save calibration settings</button></div>':''}</div>
   <h2>Purchase order</h2><div class="panel"><p class="muted" style="margin:0 0 10px">Printed on every purchase order. Approvers are set per person under Users (tick “Can approve purchase requests”).</p>
     <div class="fgrid">${[['address','Company address','textarea'],['phone','Phone'],['fax','Fax'],['email','Email'],['regNo','Company registration no.'],['sstNo','Sales Tax ID No.'],['tin','TIN (tax identification no.)'],['terms','Default payment terms'],['deliverTo','Default deliver-to address','textarea'],['prep','Prepared by (title on PO)'],['footer','Terms / note printed at the bottom of the PO','textarea']].map(([k,l,t])=>`<div class="field${t?' full':''}"><label for="po_${k}">${l}</label>${t?`<textarea id="po_${k}"${S.canAdmin?'':' readonly'}>${esc((S.settings.poDoc||{})[k]||'')}</textarea>`:`<input id="po_${k}" type="text" value="${esc((S.settings.poDoc||{})[k]||'')}"${S.canAdmin?'':' readonly'}>`}</div>`).join('')}</div>
     ${S.canAdmin?'<div class="acts" style="margin-top:12px"><button class="btn" id="savePO">Save purchase order details</button></div>':''}</div>
   <h2>Data &amp; backups</h2><div class="panel"><p style="margin:0 0 10px">Records are stored in your Supabase project${CFG.supabaseUrl?` (<span class="mono">${esc(CFG.supabaseUrl.replace(/^https?:\/\//,''))}</span>)`:''}. Download a full copy every month and keep it with your ISO 22000 records. Attachments stay in Supabase Storage.</p>
     <div class="acts"><button class="btn pri" id="bkDl">Download full data copy (.json)</button>${S.canAdmin?'<label class="btn" for="bkImp" style="cursor:pointer">Import data file</label><input id="bkImp" type="file" accept=".json,application/json" hidden>':''}</div><div id="bkMsg" class="muted" style="margin-top:8px"></div></div>`,
  bind(){
    const b=$('#saveSet');if(b)b.onclick=async()=>{const v={};['categories','departments','partCats'].forEach(k=>v[k]=$('#set_'+k).value.split('\n').map(s=>s.trim()).filter(Boolean));
      try{await saveSettings(v,'Lists updated');toast('Lists saved')}catch(e){}};
    const sd=$('#saveDosh');if(sd)sd.onclick=async()=>{const d={reportDays:num($('#set_doshDays').value)||7,perkesoHours:num($('#set_perkesoH').value)||48};try{await saveSettings({dosh:d},'Reporting deadlines: DOSH '+d.reportDays+' days, PERKESO '+d.perkesoHours+' hours');toast('Deadlines saved')}catch(e){}};
    const sc=$('#saveCal');if(sc)sc.onclick=async()=>{const c={lead:Math.max(1,num($('#set_calLead').value)||30),rule:$('#set_calRule').value==='errU'?'errU':'error'};try{await saveSettings({cal:c},'Calibration settings: remind '+c.lead+' days before; rule '+(c.rule==='errU'?'error + uncertainty':'error only'));toast('Calibration settings saved')}catch(e){}};
    const spp=$('#savePP');if(spp)spp.onclick=async()=>{const m={};let bad='';$$('[data-cat]').forEach(i=>{const v=i.value.trim().toUpperCase();if(!/^[A-Z0-9]{2,5}$/.test(v))bad=i.dataset.cat;m[i.dataset.cat]=v});
      if(bad){toast('Prefix for '+bad+' must be 2 to 5 letters or digits.');return}const vals=Object.values(m);if(new Set(vals).size!==vals.length){toast('Each category needs a different prefix.');return}
      try{await saveSettings({partPrefix:m},'Spare-part code prefixes: '+Object.entries(m).map(([k,v])=>k+' '+v).join(', '));toast('Saved');renderShell()}catch(e){}};
    const sp=$('#savePO');if(sp)sp.onclick=async()=>{const v={};['address','phone','fax','email','regNo','sstNo','tin','terms','deliverTo','prep','footer'].forEach(k=>v[k]=$('#po_'+k).value.trim());try{await saveSettings({poDoc:v},'Purchase order details updated');toast('Saved')}catch(e){}};
    $('#bkDl').onclick=()=>{const docs=[];COLLS.concat('config').forEach(c=>Object.entries(S[c]||{}).forEach(([id,data])=>docs.push({coll:c,id,data})));
      save(`GFB_Asset_Maintenance_backup_${today()}.json`,JSON.stringify({app:'GFB Asset & Maintenance',exported:new Date().toISOString(),docs},null,1))};
    const imp=$('#bkImp');if(imp)imp.onchange=async()=>{const f=imp.files[0];imp.value='';if(!f)return;const msg=$('#bkMsg');
      try{const j=JSON.parse(await f.text());const docs=(j.docs||[]).filter(d=>d&&d.coll&&d.id&&d.data);if(!docs.length){msg.textContent='No records found in that file.';return}
        msg.textContent=`Importing ${docs.length} records…`;const r=await api('POST','/api/import',{docs});msg.textContent=`${r.imported} records imported.`;S.seq=0;await sync();toast(r.imported+' records imported')}
      catch(e){msg.textContent='Import failed: '+e.message}};
  },
  list:()=>locationsHTML()};

VIEW.users={
  shell:()=>`<h2>Users</h2><p class="muted" style="margin-top:-4px"><b>Admin</b>: everything, including users, deleting records and backups. <b>Editor</b>: add and update records and attachments. <b>Viewer</b>: read only. <b>Incident access</b> lets a person see the incident register, which holds injury and health details.</p>
  <div class="panel" style="margin-bottom:12px"><b>Adding a person:</b> send them this page's link. They tap <b>Request access</b> on the sign-in screen and create a password. They then appear below as <b>Waiting for approval</b>; edit them to choose a role and activate. To reset someone's password, ask them to use <b>Forgot password</b>.</div><div id="list"><div class="empty">Loading users…</div></div>`,
  bind(){loadUsers()},
  list:()=>usersHTML()};
let USERS=[];
async function loadUsers(){try{USERS=await api('GET','/api/users');renderList()}catch(e){toast(e.message)}}
function usersHTML(){const L=USERS.slice().sort((a,b)=>(a.active===b.active?0:a.active?1:-1)||String(a.name).localeCompare(String(b.name)));
  return`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th class="hs">Email</th><th>Role</th><th class="hs">Joined</th><th></th></tr></thead><tbody>${L.map(u=>`<tr><td>${esc(u.name||u.email)}${u.id===S.me.id?' <span class="pill acc">You</span>':''}</td><td class="hs">${esc(u.email)}</td><td>${u.active?`<span class="pill ${u.role==='admin'?'acc':u.role==='editor'?'info':''}">${esc(u.role)}</span>${u.role==='admin'||u.incident_access?' <span class="pill warn">Incidents</span>':''}${u.can_approve?' <span class="pill ok">Approver</span>':''}`:'<span class="pill bad">Waiting for approval</span>'}</td><td class="hs">${fmtD(String(u.created_at).slice(0,10))}</td><td class="r"><button class="btn sm" data-eu="${esc(u.id)}">${u.active?'Edit':'Review'}</button></td></tr>`).join('')||emptyRow(5,'No users','')}</tbody></table></div>`}
function userForm(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  const fields=[{k:'name',label:'Full name',req:true},{k:'role',label:'Role',type:'select',opts:[['editor','Editor – add and update records'],['viewer','Viewer – read only'],['admin','Admin – everything']],blank:false},
    {k:'active',label:'Account active (can sign in and see records)',type:'check',full:true},{k:'incidents',label:'Incident access (sees injury and health details in the incident register)',type:'check',full:true},{k:'approve',label:'Can approve purchase requests (their name and time are recorded on each approval)',type:'check',full:true}];
  formSheet({title:(u.active?'Edit ':'Approve ')+(u.name||u.email),fields,data:{name:u.name,role:u.active?u.role:'editor',active:true,incidents:!!u.incident_access,approve:!!u.can_approve},onSave:async v=>{
    try{await api('PUT','/api/users/'+u.id,v);toast('Saved');loadUsers()}catch(e){return e.message}}});
}

/* ---------- detail drawer ---------- */
function openDetail(kind,id){S.detail={kind,id};renderDetail()}
function renderDetail(){
  if(!S.detail)return;const{kind,id}=S.detail;const l=$('#layer');
  const coll={asset:'assets',wo:'workorders',part:'parts',supplier:'suppliers',incident:'incidents',contract:'contracts',purchase:'purchases'}[kind];const r=S[coll][id];
  $$('.drawer,.scrim:not(.top)',l).forEach(e=>e.remove());
  if(!r){S.detail=null;return}
  const scrollY=l.dataset.sy||0;
  const html=DETAIL[kind](id,r);
  l.insertAdjacentHTML('afterbegin',`<div class="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(html.title)}"><div class="hd"><div style="min-width:0"><div class="lbl">${html.eyebrow}</div><h2>${esc(html.title)}</h2><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${html.pills||''}</div></div><button class="x" type="button" aria-label="Close">×</button></div><div class="bd">${html.body}
    ${filesBlock(coll,id,r)}
    <div><h3>Change history</h3><div class="hist">${(r.history||[]).slice().reverse().map(h=>`<div><span class="muted num">${fmtDT(h.at)}</span><span>${esc(h.act)} · ${who(h)}</span></div>`).join('')||'<span class="muted">No changes recorded.</span>'}</div></div></div></aside>`);
  const d=$('.drawer',l);$('.x',d).onclick=()=>closeLayer('drawer');$('.scrim:not(.top)',l).onclick=()=>closeLayer('drawer');
  bindRows(d);bindFiles(coll,id,d);fillFiles(d);if(html.bind)html.bind(d);fillNames(d);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.sheet'))closeLayer('sheet');else if($('.drawer'))closeLayer('drawer')}});
const kv=(pairs)=>`<div class="kv">${pairs.filter(Boolean).map(([k,v])=>`<div><span class="lbl">${k}</span>${v===''||v==null?'<span class="muted">—</span>':v}</div>`).join('')}</div>`;
const DETAIL={
  asset(id,a){
    const ws=Object.entries(S.workorders).filter(([,w])=>w.assetId===id).sort((x,y)=>String(y[1].reportDate).localeCompare(String(x[1].reportDate)));
    const total=ws.reduce((s,[,w])=>s+woCost(w),0),down=ws.reduce((s,[,w])=>s+num(w.downtimeHrs),0);
    const usedParts=Object.values(S.parts).filter(p=>String(p.compatible||'').toLowerCase().includes(String(a.code).toLowerCase()));
    return{eyebrow:esc(a.code)+' · '+esc(a.category||''),title:a.name,
      pills:statusPill(a.status)+(a.foodContact?'<span class="pill acc">Food-contact</span>':'')+(a.criticality?`<span class="pill">${esc(a.criticality)} criticality</span>`:''),
      body:`<div class="acts">${W(()=>`<button class="btn pri" id="dNewWO">Report problem / new job</button>${a.pmInterval?'<button class="btn" id="dPM">Log PM</button>':''}<button class="btn" id="dEdit">Edit asset</button><button class="btn" id="dMove">Move location</button><button class="btn" id="dDup">Add another unit</button>`)}<button class="btn" id="dQR">QR label</button></div>
      ${kv([['Department',esc(a.dept)],['Location / room',esc(a.location)],['Fixed asset no.',a.faNo?`<span class="mono">${esc(a.faNo)}</span>`:''],['Manufacturer / model',esc([a.manufacturer,a.model].filter(Boolean).join(' '))],['Serial no.',a.serial?`<span class="mono">${esc(a.serial)}</span>`:''],['Supplier',a.supplierId?`<a href="#" data-sup="${a.supplierId}">${esc(sup(a.supplierId)?.name||'')}</a>`:''],['Purchased',a.purchaseDate?fmtD(a.purchaseDate):''],['Installed',a.installDate?fmtD(a.installDate):''],['Warranty',a.warrantyUntil?fmtD(a.warrantyUntil)+' '+watchPill(dateWatch(a.warrantyUntil)):''],['Assigned to',esc(a.assignedTo)],['Next PM',pmPill(pmInfo(a))],['Last PM',fmtD(a.lastPM)],isIT(a)&&!isCal(a)?['Support / licence',(()=>{const c=Object.values(S.contracts).filter(x=>x.assetId===id&&x.status!=='Cancelled').sort((x,y)=>String(x.endDate).localeCompare(String(y.endDate)))[0];return c?conPill(c):''})()]:null])}
      ${a.pmTasks?`<div><h3>PM checklist</h3><ul style="margin:0;padding-left:20px">${a.pmTasks.split('\n').filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
      ${calAssetBlock(id,a)}
      ${conSection(id,a)}
      ${a.notes?`<div><h3>Specs &amp; notes</h3><div style="white-space:pre-wrap">${esc(a.notes)}</div></div>`:''}
      ${(a.moves||[]).length?`<div><h3>Location history</h3><div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Date</th><th>From → to</th><th class="hs">Reason</th></tr></thead><tbody>${a.moves.slice().reverse().map(m=>`<tr><td class="num" style="white-space:nowrap">${fmtD(m.date)}</td><td>${esc([m.fromDept,m.fromLoc].filter(Boolean).join(' · ')||'—')} → <b>${esc([m.toDept,m.toLoc].filter(Boolean).join(' · ')||'—')}</b>${m.fromUser!==m.toUser?`<br><span class="muted">User: ${esc(m.fromUser||'—')} → ${esc(m.toUser||'—')}</span>`:''}<br><span class="muted">${who(m)}</span></td><td class="hs">${esc(m.reason||'')}</td></tr>`).join('')}</tbody></table></div></div>`:''}

function bindBulk(el){

  const all=$('#selAll',el);if(all)all.onchange=()=>{const ids=filteredAssets().map(x=>x[0]);if(all.checked)ids.forEach(i=>S.sel.add(i));else ids.forEach(i=>S.sel.delete(i));renderList()};
  const c=$('#bulkClear',el);if(c)c.onclick=()=>{S.sel.clear();renderList()};
  const b=$('#bulkSet',el);if(b)b.onclick=bulkSet;
}
function bulkSet(){
  const ids=[...S.sel].filter(i=>S.assets[i]);if(!ids.length)return;
  const fields=[{k:'dept',label:'Department',type:'select',opts:()=>S.settings.departments,req:true},{k:'location',label:'Location / room',type:'locsel',deptField:'dept'},{k:'date',label:'Date',type:'date',req:true}];
  formSheet({title:`Set department & location · ${ids.length} asset(s)`,fields,data:{date:today()},extra:`<p class="muted" style="margin:0">Assets that already had a department or location get a location-history entry. Leave location blank to keep each asset's current room.</p>`,onSave:async v=>{
    let done=0;const err=$('#ferr');
    for(const id of ids){const a=S.assets[id];if(!a)continue;
      const toLoc=v.location||a.location||'';
      if(a.dept===v.dept&&(a.location||'')===toLoc){done++;continue}
      const had=a.dept||a.location;const next={...a,dept:v.dept,location:toLoc};
      if(had)next.moves=[...(a.moves||[]),{date:v.date,fromDept:a.dept||'',fromLoc:a.location||'',toDept:v.dept,toLoc,fromUser:a.assignedTo||'',toUser:a.assignedTo||'',reason:'Bulk update',at:new Date().toISOString(),...({by:S.me.id,name:S.me.name})}].slice(-100);
      try{await put('assets',id,next,(had?'Moved ':'Department / location set: ')+(had?[a.dept,a.location].filter(Boolean).join(' · ')+' → ':'')+[v.dept,toLoc].filter(Boolean).join(' · ')+' (bulk)')}
      catch(e){return`Stopped after ${done} of ${ids.length}: ${e.message||'save failed'}. Press Save to continue with the rest.`}
      done++;S.sel.delete(id);if(done%10===0&&err){err.hidden=false;err.style.color='var(--muted)';err.textContent=`Saving… ${done} of ${ids.length}`}
    }
    S.sel.clear();toast(`${done} asset(s) updated`);renderList();
  }});
}

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const toISO=s=>{s=String(s||'').trim();if(!s)return'';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);return''};
const IMPORT_COLS=['code','name','category','department','location','status','criticality','food_contact','manufacturer','model','serial','purchase_date','warranty_until','assigned_to','pm_interval_days','last_pm','notes'];
function importAssets(){
  openSheet({title:'Import assets from CSV',body:`<p style="margin:0">Use one row per asset with these column headings (any order). Dates as DD/MM/YYYY. Existing asset codes are skipped.</p>
  <div class="mono" style="background:var(--surface-2);padding:10px;border-radius:7px;overflow-x:auto;white-space:nowrap">${IMPORT_COLS.join(',')}</div>
  <div class="acts"><button type="button" class="btn" id="tpl">Download template</button><label class="btn pri" for="csvf" style="cursor:pointer">Choose CSV file</label><input type="file" id="csvf" accept=".csv,text/csv" hidden></div><div id="imp"></div>`});

  $('#csvf').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;const rows=parseCSV(await file.text());if(rows.length<2){$('#imp').innerHTML='<p class="err">No data rows found.</p>';return}

    const g=(r,k)=>ix(k)>=0?String(r[ix(k)]||'').trim():'';

    $('#imp').innerHTML='<p class="muted">Importing…</p>';
    for(const r of rows.slice(1)){

      const iv=g(r,'pm_interval_days');
      const a={code,name,category:g(r,'category'),dept:g(r,'department'),location:g(r,'location'),status:ASSET_STATUS.includes(g(r,'status'))?g(r,'status'):'Active',criticality:g(r,'criticality'),foodContact:/^(y|yes|true|1)$/i.test(g(r,'food_contact')),manufacturer:g(r,'manufacturer'),model:g(r,'model'),serial:g(r,'serial'),purchaseDate:toISO(g(r,'purchase_date')),warrantyUntil:toISO(g(r,'warranty_until')),assignedTo:g(r,'assigned_to'),pmInterval:iv?String(parseInt(iv)||''):'',lastPM:toISO(g(r,'last_pm')),calibInterval:'',notes:g(r,'notes')};
      try{await put('assets',newId('assets'),a,'Imported from CSV');have.add(code.toLowerCase());added++}catch(err){break}
    }
    try{await addLocations(Object.values(S.assets).filter(a=>a.location).map(a=>({name:a.location,dept:a.dept})))}catch(e){}
    $('#imp').innerHTML=`<p><b>${added}</b> asset(s) imported${skipped?`, ${skipped} row(s) skipped (blank or code already exists)`:''}.</p>`;renderList();

const INC_CATS=['Accident – injury','Dangerous occurrence','Occupational poisoning','Occupational disease','Near miss','Property / equipment damage only'];
const INC_SEV=['Fatal','Serious bodily injury (Schedule 1)','Lost time – more than 4 days','Lost time – 4 days or less','Medical treatment, no lost time','First aid only','No injury'];
const INC_STATUS=['Reported','Under investigation','Action pending','Closed'];
const PERSON_TYPES=['Employee','Foreign worker (employee)','Contractor','Visitor','Self-employed'];
const hasPerson=i=>['Accident – injury','Occupational poisoning','Occupational disease'].includes(i.category);
const lostTime=i=>i.category==='Accident – injury'&&(i.severity==='Fatal'||!!i.deathDate||i.severity==='Serious bodily injury (Schedule 1)'||i.severity==='Lost time – more than 4 days'||i.severity==='Lost time – 4 days or less'||num(i.daysLost)>0);
function doshInfo(i){
  const c=i.category,s=i.severity,acc=c==='Accident – injury';
  const immediate=c==='Dangerous occurrence'||(acc&&(s==='Fatal'||s==='Serious bodily injury (Schedule 1)'));
  const written=immediate||(acc&&!!i.deathDate)||(acc&&s==='Lost time – more than 4 days')||c==='Occupational poisoning'||c==='Occupational disease';
  const form=(c==='Occupational poisoning'||c==='Occupational disease')?'JKKP 7':'JKKP 6';
  const days=num(S.settings.dosh&&S.settings.dosh.reportDays)||7;
  return{immediate,written,form,days,due:written&&i.incDate?addDays(i.incDate,days):''};
}
function perkesoInfo(i){
  const need=hasPerson(i)&&['Employee','Foreign worker (employee)'].includes(i.personType)&&!!i.severity&&i.severity!=='No injury';
  const hrs=num(S.settings.dosh&&S.settings.dosh.perkesoHours)||48;
  let dueAt='';if(need&&i.incDate){const d=new Date(i.incDate+'T'+(i.incTime||'00:00'));d.setHours(d.getHours()+hrs);dueAt=d.toISOString()}
  return{need,hrs,dueAt};
}
function doshPill(i){const d=doshInfo(i);if(!d.written)return'<span class="pill">Not notifiable to DOSH</span>';
  if(i.doshReportDate)return`<span class="pill ok">${d.form} sent ${fmtD(i.doshReportDate)}</span>`;
  const left=dayDiff(today(),d.due);return`<span class="pill ${left<0?'bad':left<=2?'warn':'info'}">${d.form} ${left<0?Math.abs(left)+' d overdue':'due '+fmtD(d.due)}</span>`}
function perkesoPill(i){const p=perkesoInfo(i);if(!p.need)return'';if(i.perkesoDate)return`<span class="pill ok">Borang 34 sent ${fmtD(i.perkesoDate)}</span>`;
  const late=Date.now()>new Date(p.dueAt).getTime();return`<span class="pill ${late?'bad':'warn'}">Borang 34 ${late?'overdue':'due '+fmtDT(p.dueAt)}</span>`}
const incPending=i=>i.status!=='Closed'&&((doshInfo(i).immediate&&!i.doshNotifiedAt)||(doshInfo(i).written&&!i.doshReportDate)||(perkesoInfo(i).need&&!i.perkesoDate));

const incStatusPill=s=>`<span class="pill ${({'Reported':'bad','Under investigation':'warn','Action pending':'warn','Closed':'ok'})[s]||''}">${esc(s||'Reported')}</span>`;
const incWhen=i=>fmtD(i.incDate)+(i.incTime?' '+i.incTime:'');

function nextIncNo(){
  const d=new Date();const pre='INC-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+'-';
  const max=Object.values(S.incidents).filter(i=>String(i.no).startsWith(pre)).reduce((m,i)=>Math.max(m,parseInt(String(i.no).slice(pre.length))||0),0);
  return pre+String(max+1).padStart(3,'0');
}
function evChips(ev,edit){return(ev||[]).map((f,i)=>`<span class="evc"><a data-fp="${esc(f.id)}" href="#" target="_blank" rel="noopener" title="${esc(f.name)}">${String(f.ct).startsWith('image/')?'Photo':'PDF'}: ${esc(f.name)}</a>${edit?`<button type="button" class="ev-x" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button>`:''}</span>`).join('')}
function capaRow(c){return`<div class="capa" data-cid="${esc(c.cid||'')}" data-ev="${esc(JSON.stringify(c.evidence||[]))}"><input class="ca-a" type="text" aria-label="Action" placeholder="Corrective / preventive action" value="${esc(c.action)}"><input class="ca-o" type="text" aria-label="Owner" placeholder="Owner" value="${esc(c.owner)}"><input class="ca-d" type="date" aria-label="Due date" value="${esc(c.due)}"><select class="ca-s" aria-label="Status">${opt('Open',c.status||'Open')}${opt('Done',c.status)}</select><label class="btn sm ca-f" style="cursor:pointer" title="Attach photo or PDF as evidence (optional)">Attach<input class="ca-in" type="file" multiple accept="image/*,application/pdf" hidden aria-label="Attach evidence"></label><button type="button" class="btn sm ca-x" aria-label="Remove action">×</button><div class="ca-ev">${evChips(c.evidence,true)}</div></div>`}
function capaEditor(list){return`<div class="fgrid"><div class="sec">Corrective &amp; preventive actions (CAPA)</div></div><div class="lines" id="capa">${list.map(capaRow).join('')}</div><div><button type="button" class="btn sm" id="addCapa">Add action</button> <span class="muted" style="font-size:12px">Evidence (photo or PDF) is optional. Use Attach on each action.</span></div>`}
function readCapa(prev){return $$('#capa .capa').map((r,ix)=>{const s=$('.ca-s',r).value;const p=(prev||[])[ix]||{};return{cid:r.dataset.cid||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),action:$('.ca-a',r).value.trim(),owner:$('.ca-o',r).value.trim(),due:$('.ca-d',r).value,status:s,evidence:JSON.parse(r.dataset.ev||'[]'),doneDate:s==='Done'?(p.status==='Done'&&p.doneDate?p.doneDate:today()):''}}).filter(c=>c.action)}

function incForm(id,preset={}){
  const prev=id?S.incidents[id]:null;
  const data=prev||{category:'Accident – injury',incDate:today(),status:'Reported',reportedBy:S.me.name,...preset};
  const key=id||('inc-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));let evPending=0;
  const sh=formSheet({title:prev?(prev.draft?'Draft incident report':'Update '+prev.no):'Report incident / accident',fields:F_INC,data,extra:capaEditor((prev&&prev.capa)||[]),
    danger:prev&&S.canAdmin?{label:prev.draft?'Discard draft':'Delete record',onClick:()=>prev.draft?confirmBox('Discard this draft?','This unfinished incident report has no reference number and is not in the register. It will be removed.','Discard draft',async()=>{await api('DELETE','/api/docs/incidents/'+id);delete S.incidents[id];closeLayer('drawer');renderList();toast('Draft discarded')}):confirmBox('Delete '+prev.no+'?','DOSH requires every register entry to be kept for at least 5 years (NADOPOD Regulations 2004, reg. 10). Delete only a record entered by mistake.','Delete',async()=>{await api('DELETE','/api/docs/incidents/'+id);delete S.incidents[id];closeLayer('drawer');renderList()})}:null,
    onDraft:(!prev||prev.draft)?async v=>{
      if(evPending)return'Please wait for the evidence upload to finish.';
      const next={...(prev||{}),...v,capa:readCapa(prev&&prev.capa),no:'',draft:true};
      await put('incidents',key,next,prev?'Draft updated':'Saved as draft');toast('Draft saved. It is not in the register until you complete and save it.');renderList();if(prev)renderDetail();else openDetail('incident',key);
    }:null,
    onSave:async v=>{
      if(evPending)return'Please wait for the evidence upload to finish.';
      const caps=readCapa(prev&&prev.capa);
      if(hasPerson(v)&&!v.personName)return'Enter the name of the person involved.';
      if(v.category==='Accident – injury'&&!v.severity)return'Choose the severity of the injury.';
      const d=doshInfo(v),p=perkesoInfo(v);
      if(v.status==='Closed'){
        if(!v.investigatedBy)return'Enter who investigated before closing.';
        if(caps.some(c=>c.status!=='Done'))return'Complete all corrective actions before closing.';
        if(d.immediate&&!v.doshNotifiedAt)return'Record when the DOSH office was notified before closing.';
        if(d.written&&!v.doshReportDate)return`Record the date the ${d.form} report was submitted before closing.`;
        if(p.need&&!v.perkesoDate)return'Record the Borang 34 (PERKESO) submission before closing.';
        if(!v.closedDate)v.closedDate=today();
      }
      const next={...(prev||{}),...v,capa:caps,no:(prev&&prev.no)||nextIncNo()};const wasDraft=!!next.draft;delete next.draft;
      const act=prev&&!wasDraft?diffAct(prev,next,F_INC)+(JSON.stringify(prev.capa||[])!==JSON.stringify(caps)?'; actions (CAPA)':''):'Reported '+next.no+' ('+next.category+(next.severity&&hasPerson(next)?', '+next.severity:'')+')';
      await put('incidents',key,next,act);
      toast(d.immediate&&!next.doshNotifiedAt?'Saved. Notify the nearest DOSH office now by phone or email.':(prev?next.no+' updated':next.no+' recorded'));
      renderList();if(prev)renderDetail();else openDetail('incident',key);
    }});
  if(!sh)return;
  const box=$('#capa',sh);
  const redraw=row=>{const ev=JSON.parse(row.dataset.ev||'[]');$('.ca-ev',row).innerHTML=evChips(ev,true)+(row._up?`<span class="evc up">Uploading ${row._up}…</span>`:'');fillFiles(row)};
  box.addEventListener('click',e=>{const x=e.target.closest('.ca-x');if(x){x.closest('.capa').remove();return}
    const r=e.target.closest('.ev-x');if(r){const row=r.closest('.capa');const ev=JSON.parse(row.dataset.ev||'[]');ev.splice(+r.dataset.i,1);row.dataset.ev=JSON.stringify(ev);redraw(row)}});
  box.addEventListener('change',async e=>{const inp=e.target.closest('.ca-in');if(!inp)return;const row=inp.closest('.capa');const list=[...inp.files];inp.value='';
    for(const f of list){evPending++;row._up=f.name;redraw(row);
      try{const res=await uploadFile('incidents',key,f);const ev=JSON.parse(row.dataset.ev||'[]');ev.push({id:res.id,name:res.name,ct:res.ct,size:res.size,at:new Date().toISOString(),by:S.me.name});row.dataset.ev=JSON.stringify(ev)}
      catch(err){toast(f.name+': '+err.message)}
      finally{evPending--;row._up='';redraw(row)}}});
  $('#addCapa',sh).onclick=()=>box.insertAdjacentHTML('beforeend',capaRow({status:'Open'}));
  fillFiles(box);
}

function summaryDoc(year,workers,hours){

function renewalPlan(from,to){
  const out=[],lapsed=[];
  Object.entries(S.contracts).forEach(([id,c])=>{if(c.status==='Cancelled'||!c.endDate)return;
    const pm=periodMonths(c);const per=pm===0?num(c.annualCost):num(c.annualCost)*pm/12;
    if(c.endDate<today())lapsed.push([id,c]);
    if(pm===0){if(c.endDate>=from&&c.endDate<=to)out.push({id,c,date:c.endDate,cost:per,proj:false});return}
    for(let k=0;k<400;k++){const d=k?addMonths(c.endDate,pm*k):c.endDate;if(d>to)break;if(d>=from)out.push({id,c,date:d,cost:per,proj:k>0})}
  });

}

async function buildHirarc(L,h){

      F:i.consPeople||(hasPerson(i)?sevToPeople(i.severity):'N/A'),G:i.consAssets||'',H:i.consEnv||'',I:i.consRep||'',
      J:i.existingControl||'',K:i.likelihoodJust||'',L:num(i.riskL)||null,M:num(i.riskS)||null,
      O:capa.map((c,k)=>(capa.length>1?(k+1)+'. ':'')+c.action+(c.status==='Done'?' (done '+fmtD(c.doneDate)+')':'')).join('\n'),
      P:num(i.resL)||null,Q:num(i.resS)||null,

      T:[i.no,i.category,'Status: '+(i.status||''),i.hirarcReviewed?'HIRARC reviewed':''].filter(Boolean).join('\n')};

      cell.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};cell.font={name:'Arial',size:9};
      cell.alignment={wrapText:true,vertical:'top',horizontal:['A','L','M','N','P','Q','R'].includes(c)?'center':'left'};

const purLinesTotal=p=>Math.round((p.lines||[]).reduce((s,l)=>s+num(l.qty)*num(l.price),0)*100)/100;

const purRecv=(p,lid)=>(p.receipts||[]).reduce((s,r)=>s+(r.lines||[]).filter(x=>x.lid===lid).reduce((t,x)=>t+num(x.qty),0),0);
const purOpen=p=>['PO issued','Partly received'].includes(p.status);
const purSapMissing=p=>['Received','Partly received'].includes(p.status)&&!(p.inv&&p.inv.sapRef);
function purNextNo(kind){const d=new Date();const pre=kind+'-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+'-';const k=kind==='PO'?'poNo':'no';
  const max=Object.values(S.purchases).filter(p=>String(p[k]||'').startsWith(pre)).reduce((m,p)=>Math.max(m,parseInt(String(p[k]).slice(pre.length))||0),0);return pre+String(max+1).padStart(3,'0')}
function purItemsText(p){const L=p.lines||[];if(!L.length)return'';return esc(L[0].desc||'')+(L.length>1?` <span class="muted">+${L.length-1} more</span>`:'')}
function onOrderQty(partId){return Object.values(S.purchases).filter(purOpen).reduce((s,p)=>s+(p.lines||[]).filter(l=>l.partId===partId).reduce((t,l)=>t+Math.max(0,num(l.qty)-purRecv(p,l.lid)),0),0)}
const lidNew=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* line editor */
function purLineSel(l){return l.partId?l.partId:(l.kind==='svc'?'__svc':'__new')}
function purLineRow(l){const parts=Object.entries(S.parts).sort(byStr('code'));const sel=purLineSel(l);
  return`<div class="pl" data-lid="${esc(l.lid||lidNew())}"><select class="pl-p" aria-label="Item"><option value="__new"${sel==='__new'?' selected':''}>＋ New item (adds to Part &amp; Consumables)</option><option value="__svc"${sel==='__svc'?' selected':''}>Service / non-stock (not added to list)</option>${parts.length?`<optgroup label="Existing items">${parts.map(([pid,p])=>`<option value="${pid}"${sel===pid?' selected':''}>${esc(p.code)} · ${esc(p.name)} (on hand ${num(p.qty)})</option>`).join('')}</optgroup>`:''}</select>
  <input class="pl-d" type="text" aria-label="Description" placeholder="Item name / specification" value="${esc(l.desc)}">
  <input class="pl-q" type="number" step="any" inputmode="decimal" aria-label="Quantity" placeholder="Qty" value="${esc(l.qty)}">
  <input class="pl-u" type="text" aria-label="Unit" placeholder="Unit" value="${esc(l.unit)}">
  <input class="pl-r" type="number" step="any" inputmode="decimal" aria-label="Unit price (RM)" placeholder="Unit price" value="${esc(l.price)}">
  <span class="pl-a num muted"></span><button type="button" class="btn sm pl-x" aria-label="Remove item">×</button>
  <div class="pl-n"${sel==='__new'?'':' hidden'}><select class="pl-c" aria-label="Category for the new item"><option value="">Category…</option>${S.settings.partCats.map(c=>opt(c,l.cat)).join('')}</select><span class="pl-code muted"></span></div></div>`}
function purLinesHTML(lines){return`<div class="fgrid"><div class="sec">Items</div></div><div class="plh muted"><span>Item</span><span>Name / description</span><span>Qty</span><span>Unit</span><span>Unit price (RM)</span><span>Amount</span><span></span></div>
  <div id="purLines">${(lines.length?lines:[{}]).map(purLineRow).join('')}</div>
  <div class="acts" style="margin:4px 0"><button type="button" class="btn sm" id="plAdd">Add item</button><span class="muted">Total <b id="plTot" class="num">RM 0.00</b></span></div>
  <p class="muted" style="margin:0;font-size:12px">Pick an existing item, or <b>＋ New item</b> with its category: it gets an item code automatically and is added to Part &amp; Consumables when you submit, so stock goes up when the goods arrive. Use <b>Service / non-stock</b> for repairs, labour or one-off tools you do not keep in store.</p>`}
function bindPurLines(sh){const box=$('#purLines',sh);if(!box)return;
  const calc=()=>{let t=0;const seen={};$$('.pl',box).forEach(r=>{const a=num($('.pl-q',r).value)*num($('.pl-r',r).value);t+=a;$('.pl-a',r).textContent=a?rm(a):'';
    const isNew=$('.pl-p',r).value==='__new';$('.pl-n',r).hidden=!isNew;
    if(isNew){const c=$('.pl-c',r).value;if(c){const base=nextPartCode(c);const m=base.match(/^(.*-)(\d+)$/);const n=(seen[c]||0);seen[c]=n+1;const code=m?m[1]+String(parseInt(m[2],10)+n).padStart(m[2].length,'0'):base;$('.pl-code',r).innerHTML='Item code: <b class="mono">'+esc(code)+'</b> (given when submitted)'}else $('.pl-code',r).textContent='Choose a category to get the item code.'}});
    $('#plTot',sh).textContent=rm(t)};
  box.addEventListener('change',e=>{const s=e.target.closest('.pl-p');if(s){const r=s.closest('.pl'),p=S.parts[s.value];if(p){$('.pl-d',r).value=p.code+' · '+p.name;if(!$('.pl-u',r).value)$('.pl-u',r).value=p.unit||'';if(!$('.pl-r',r).value&&p.unitCost!==''&&p.unitCost!=null)$('.pl-r',r).value=p.unitCost;
    if(!$('.pl-q',r).value&&p.minQty!==''&&p.minQty!=null)$('.pl-q',r).value=Math.max(1,num(p.minQty)*2-num(p.qty))}}calc()});
  box.addEventListener('input',calc);
  box.addEventListener('click',e=>{const x=e.target.closest('.pl-x');if(x){x.closest('.pl').remove();calc()}});
  $('#plAdd',sh).onclick=()=>{box.insertAdjacentHTML('beforeend',purLineRow({}));calc()};calc()}
function readPurLines(sh){return $$('#purLines .pl',sh).map(r=>{const sel=$('.pl-p',r).value;const kind=sel==='__new'?'new':sel==='__svc'?'svc':'part';
  return{lid:r.dataset.lid,partId:kind==='part'?sel:'',kind,cat:kind==='new'?$('.pl-c',r).value:'',desc:$('.pl-d',r).value.trim(),qty:$('.pl-q',r).value.trim()===''?'':num($('.pl-q',r).value),unit:$('.pl-u',r).value.trim(),price:$('.pl-r',r).value.trim()===''?'':num($('.pl-r',r).value)}}).filter(l=>l.partId||l.desc||l.qty!=='')}
/* create the new items in Part & Consumables (with their auto item code) and link the lines to them */
async function purCreateParts(lines,prNo){const made=[];
  for(const l of lines){if(l.kind!=='new')continue;
    const hit=Object.entries(S.parts).find(([,p])=>String(p.name||'').trim().toLowerCase()===l.desc.toLowerCase());
    if(hit){l.partId=hit[0];l.desc=hit[1].code+' · '+hit[1].name;l.kind='part';delete l.cat;continue}
    const code=nextPartCode(l.cat),key=newId('parts');
    await put('parts',key,{code,name:l.desc,category:l.cat,unit:l.unit,unitCost:l.price===''?'':num(l.price),qty:0,minQty:'',moves:[]},'Created from purchase request '+prNo);
    made.push(code);l.partId=key;l.desc=code+' · '+l.desc;l.kind='part';delete l.cat}
  return made}

/* purchase request form */
const F_PR=[
  {type:'sec',label:'Request'},
  {k:'requestedBy',label:'Requested by',req:true},
  {k:'dept',label:'Department',type:'select',opts:()=>S.settings.departments},
  {k:'reqDate',label:'Request date',type:'date',req:true},
  {k:'neededBy',label:'Needed by',type:'date'},
  {k:'woId',label:'For work order (optional)',type:'select',opts:()=>Object.entries(S.workorders).filter(([,w])=>!w.draft&&w.no).sort((a,b)=>String(b[1].no).localeCompare(String(a[1].no))).slice(0,300).map(([id,w])=>[id,w.no+' · '+woWhat(w)])},
  {k:'supplierId',label:'Suggested supplier (optional)',type:'select',opts:supOpts},
  {k:'purpose',label:'Purpose / reason',type:'textarea',full:true,req:true,ph:'Why it is needed, e.g. replace worn sealer jaw on SM05; re-order below minimum stock'}
];
function purForm(id,preset={}){
  const prev=id?S.purchases[id]:null;
  if(prev&&!['Draft','Pending approval','Rejected','Approved'].includes(prev.status)){toast('A purchase order has been issued; items can no longer be edited here.');return}
  const data=prev||{requestedBy:S.me.name,reqDate:today(),...preset};
  const key=id||newId('purchases');
  const sh=formSheet({title:prev?(prev.no?'Edit '+prev.no:'Draft purchase request'):'New purchase request',fields:F_PR,data,extra:purLinesHTML((prev&&prev.lines)||preset.lines||[]),saveLabel:prev&&prev.status==='Approved'?'Save':'Submit for approval',
    danger:prev&&S.canAdmin?{label:prev.status==='Draft'?'Discard draft':'Delete request',onClick:()=>confirmBox('Delete '+(prev.no||'this draft')+'?','The purchase request and its approval record will be removed. Consider setting it to Cancelled instead so the record is kept.','Delete',async()=>{await api('DELETE','/api/docs/purchases/'+id);delete S.purchases[id];closeLayer('drawer');renderList();toast('Deleted')})}:null,
    onDraft:(!prev||prev.status==='Draft')?async v=>{const lines=readPurLines(sh);await put('purchases',key,{...(prev||{}),...v,lines,status:'Draft',no:''},'Saved as draft');toast('Draft saved');renderList();openDetail('purchase',key)}:null,
    onSave:async v=>{const lines=readPurLines(sh);
      if(!lines.length)return'Add at least one item.';
      const bad=lines.find(l=>!l.desc||!(num(l.qty)>0));if(bad)return'Each item needs a description and a quantity above 0.';
      if(lines.some(l=>l.kind==='new'&&!l.cat))return'Choose a category for each new item, so it gets its item code.';
      const prNo=(prev&&prev.no)||purNextNo('PR');let made=[];
      try{made=await purCreateParts(lines,prNo)}catch(e){return'Could not add the new item(s) to Part & Consumables: '+e.message}
      const next={...(prev||{}),...v,lines,no:prNo};const tot=purLinesTotal(next);let act;
      if(prev&&prev.status==='Approved'&&prev.approval&&prev.approval.decision==='Approved'&&tot<=num(prev.approval.total)+0.005){act='Items updated (within approved amount)'}
      else{next.status='Pending approval';next.approval=null;next.submittedAt=new Date().toISOString();if(!next.no)next.no=purNextNo('PR');
        act=prev&&prev.status==='Approved'?'Amount raised above approved '+rm(prev.approval.total)+' → sent back for approval':prev&&prev.status==='Rejected'?'Revised and resubmitted for approval':'Submitted for approval · '+rm(tot)}
      try{await put('purchases',key,next,act)}catch(e){return e.message}
      toast((next.status==='Pending approval'?next.no+' sent for approval':'Saved')+(made.length?' · added to Part & Consumables: '+made.join(', '):''));renderList();openDetail('purchase',key)}});
  if(sh)bindPurLines(sh);
}

/* approval */
function purDecide(id,decision){const p=S.purchases[id];
  const fields=[{k:'note',label:decision==='Approved'?'Approval note (optional)':'Reason for rejecting',type:'textarea',full:true,req:decision!=='Approved'}];
  formSheet({title:(decision==='Approved'?'Approve ':'Reject ')+p.no,fields,data:{},saveLabel:decision==='Approved'?'Approve '+rm(purLinesTotal(p)):'Reject',
    extra:`<p class="muted" style="margin:0">${(p.lines||[]).length} item(s) · ${rm(purLinesTotal(p))} · requested by ${esc(p.requestedBy||'')}. Your name, the date and time are recorded with the decision.</p>`,
    onSave:async v=>{try{await put('purchases',id,{...p,status:decision,approval:{decision,note:v.note||''}},(decision==='Approved'?'Approved':'Rejected')+(v.note?': '+v.note:''))}catch(e){return e.message}
      toast(p.no+' '+decision.toLowerCase());renderList();renderDetail()}});
}

/* purchase order */
function poForm(id){const p=S.purchases[id];const st=S.settings.poDoc||{};const po=p.po||{};
  const fields=[{k:'supplierId',label:'Supplier',type:'select',opts:supOpts,req:true},{k:'date',label:'PO date',type:'date',req:true},{k:'delivery',label:'Delivery date required'},
    {k:'terms',label:'Payment terms',ph:'e.g. 30 days'},{k:'quoteRef',label:'Supplier quotation ref.'},{k:'deliverTo',label:'Deliver to',full:true},
    {k:'otherLabel',label:'Other charges / tax: description',ph:'e.g. Delivery charge, SST'},{k:'other',label:'Other charges / tax (RM)',type:'number'},
    {k:'remarks',label:'Remarks on PO',type:'textarea',full:true}];
  const lines=(p.lines||[]).map(l=>({...l}));const apTot=num(p.approval&&p.approval.total);
  let saveFn=null;
  const sh=formSheet({title:(p.poNo?'Edit ':'Create ')+'purchase order · '+p.no,fields,saveLabel:p.poNo?'Save':'Issue PO',onSave:v=>saveFn(v),
    data:{supplierId:po.supplierId||p.supplierId||'',date:po.date||today(),delivery:po.delivery||p.neededBy||'',terms:po.terms||st.terms||'',quoteRef:po.quoteRef||'',deliverTo:po.deliverTo||st.deliverTo||'',otherLabel:po.otherLabel||'',other:po.other??'',remarks:po.remarks||''},
    extra:`<div class="fgrid"><div class="sec">Confirmed prices</div></div><div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Unit price (RM)</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${esc(l.desc)}</td><td class="r num">${esc(l.qty)} ${esc(l.unit||'')}</td><td class="r"><input type="number" step="any" inputmode="decimal" class="po-pr" data-lid="${esc(l.lid)}" value="${esc(l.price)}" style="max-width:130px;text-align:right"${p.poNo?' disabled':''}></td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="margin:4px 0 0" id="poTotNote"></p>`});
  if(!sh)return;
  const note=()=>{const t=lines.reduce((s,l)=>s+num(l.qty)*num(($(`.po-pr[data-lid="${l.lid}"]`,sh)||{}).value),0);const over=t>apTot+0.005;
    $('#poTotNote',sh).innerHTML=`Items ${rm(t)} · approved ${rm(apTot)}${over?(isApprover()?' · <b>above the approved amount</b>; saving re-approves it under your name.':' · <b style="color:var(--bad)">above the approved amount</b>; saving sends it back for approval instead of issuing the PO.'):''} Other charges / tax are added on the PO and are not part of the approved item amount.`};
  $$('.po-pr',sh).forEach(i=>i.addEventListener('input',note));note();
  saveFn=async v=>{
    const nl=lines.map(l=>({...l,price:p.poNo?l.price:num(($(`.po-pr[data-lid="${l.lid}"]`,sh)||{}).value)}));const t=nl.reduce((s,l)=>s+num(l.qty)*num(l.price),0);
    const next={...p,lines:nl,po:{...po,...v,other:v.other===''?'':num(v.other)}};let act;
    if(t>apTot+0.005&&!p.poNo){
      if(isApprover()){next.approval={decision:'Approved',note:'Re-approved at PO stage for '+rm(t)};next.status='PO issued';next.poNo=purNextNo('PO');next.po.issuedAt=new Date().toISOString();next.po.issuedBy=S.me.name;act='Re-approved '+rm(t)+' and issued '+next.poNo}
      else{next.status='Pending approval';next.approval=null;act='Confirmed prices '+rm(t)+' above approved '+rm(apTot)+' → sent back for approval'}}
    else if(!p.poNo){next.status='PO issued';next.poNo=purNextNo('PO');next.po.issuedAt=new Date().toISOString();next.po.issuedBy=S.me.name;act='Purchase order '+next.poNo+' issued to '+(sup(v.supplierId)?.name||'')}
    else act='Purchase order details updated';
    try{await put('purchases',id,next,act)}catch(e){return e.message}
    toast(next.status==='PO issued'?next.poNo+' issued':'Sent back for approval');renderList();renderDetail()};

}
