  set('C3',h.dept);set('C4',h.process);set('C5',h.location);set('G3',h.assessor);set('G4',h.team1);set('G5',h.team2);
  set('L4',h.approver);set('L5',h.designation);set('P4',h.raRef||'');
  if(h.assessDate){const [y,m,d]=h.assessDate.split('-').map(Number);ws.getCell('C6').value=new Date(Date.UTC(y,m-1,d));ws.getCell('C6').numFmt='dd/mm/yyyy'}
  set('G6',h.lastAssess);
  const cols='ABCDEFGHIJKLMNOPQRST'.split('');const widths={};cols.forEach(c=>widths[c]=ws.getColumn(c).width||9);
  const first=11,lastTpl=39;
  L.forEach(([,i],ix)=>{
    const rn=first+ix,row=ws.getRow(rn);
    if(rn>lastTpl)cols.forEach(c=>{row.getCell(c).style=JSON.parse(JSON.stringify(ws.getRow(lastTpl).getCell(c).style||{}))});
    const capa=(i.capa||[]);
    const v={A:ix+1,B:i.activity||i.title,C:i.hazard||i.immediateCause||'',D:i.hazardCat||'',
      E:i.title+(i.description&&i.description!==i.title?'\n'+i.description:'')+`\n(${i.no}, ${fmtD(i.incDate)})`,
      F:i.consPeople||(hasPerson(i)?sevToPeople(i.severity):'N/A'),G:i.consAssets||'',H:i.consEnv||'',I:i.consRep||'',
      J:i.existingControl||'',K:i.likelihoodJust||'',L:num(i.riskL)||null,M:num(i.riskS)||null,
      O:capa.map((c,k)=>(capa.length>1?(k+1)+'. ':'')+c.action+(c.status==='Done'?' (done '+fmtD(c.doneDate)+')':'')).join('\n'),
      P:num(i.resL)||null,Q:num(i.resS)||null,
      S:capa.map((c,k)=>(capa.length>1?(k+1)+'. ':'')+[c.owner,c.due&&fmtD(c.due)].filter(Boolean).join(' – ')).filter(x=>x.replace(/^\d+\.\s*/,'')).join('\n'),
      T:[i.no,i.category,'Status: '+(i.status||''),i.hirarcReviewed?'HIRARC reviewed':''].filter(Boolean).join('\n')};
    let lines=1;
    cols.forEach(c=>{const cell=row.getCell(c);cell.style=JSON.parse(JSON.stringify(cell.style||{}));
      if(c==='N')cell.value={formula:`L${rn}*M${rn}`};else if(c==='R')cell.value={formula:`P${rn}*Q${rn}`};else cell.value=v[c]===''||v[c]==null?null:v[c];
      cell.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};cell.font={name:'Arial',size:9};
      cell.alignment={wrapText:true,vertical:'top',horizontal:['A','L','M','N','P','Q','R'].includes(c)?'center':'left'};
      if(typeof v[c]==='string'){const per=Math.max(4,Math.floor(widths[c]*1.15));lines=Math.max(lines,v[c].split('\n').reduce((t,s)=>t+Math.max(1,Math.ceil(s.length/per)),0))}});
    row.height=Math.min(400,Math.max(30,lines*13+6));
    if(rn>40){[['D','$W$5:$W$9'],['F','$X$5:$X$10']].forEach(([c,f])=>{row.getCell(c).dataValidation={type:'list',allowBlank:true,formulae:[f]}})}
  });
  const lastRow=Math.max(lastTpl,first+L.length-1);
  for(let rn=first+L.length;rn<=lastTpl;rn++){ws.getRow(rn).height=18}
  const band=(ref)=>ws.addConditionalFormatting({ref,rules:[
    {type:'cellIs',operator:'between',formulae:[15,25],priority:1,style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFF5B5B'}},font:{bold:true}}},
    {type:'cellIs',operator:'between',formulae:[8,12],priority:2,style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFFA94D'}}}},
    {type:'cellIs',operator:'between',formulae:[4,6],priority:3,style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFFE066'}}}},
    {type:'cellIs',operator:'between',formulae:[1,3],priority:4,style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FF8CE99A'}}}}]});
  band(`N${first}:N${lastRow}`);band(`R${first}:R${lastRow}`);
  for(let rn=first+L.length;rn<=lastTpl;rn++)cols.forEach(c=>{const cell=ws.getRow(rn).getCell(c);cell.style={...JSON.parse(JSON.stringify(cell.style||{})),border:{top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}}});
  ws.pageSetup.printArea=`A$1:T$${lastRow}`;
  const buf=await wb.xlsx.writeBuffer();
  const name=`GFB_HIRARC_${String(h.dept||'All').replace(/[^A-Za-z0-9]+/g,'_')}_${h.assessDate||today()}.xlsx`;
  save(name,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  toast('HIRARC downloaded: '+L.length+' row(s)');
}

{const ix=F_INC.findIndex(f=>f.type==='sec'&&/^Status/.test(f.label));F_INC.splice(ix<0?F_INC.length:ix,0,...F_HIRARC)}
function routeHash(){const m=location.hash.match(/^#asset-([A-Za-z0-9_\-]+)$/);if(m&&S.assets[m[1]]){openDetail('asset',m[1]);history.replaceState(null,'',location.pathname)}else{const v=location.hash.slice(1);if(ALLVIEWS.some(x=>x[0]===v))go(v)}}
window.addEventListener('hashchange',routeHash);

/* ---------- sign-in ---------- */
function authCard(inner){closeLayer('sheet');closeLayer('drawer');$('#tabs').innerHTML='';$('#me').innerHTML='';$('#main').innerHTML=`<div class="login">${inner}</div>`}
function showLogin(mode){
  mode=mode||'signin';
  const f=(id,label,type,ac)=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" autocomplete="${ac}"${type==='email'?' autocapitalize="none" spellcheck="false"':''}></div>`;
  const body={signin:`<h2>Sign in</h2>${f('l_user','Email','email','username')}${f('l_pass','Password','password','current-password')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Sign in</button>
      <p class="muted" style="margin:0;font-size:13px"><a href="#" data-m="signup">Request access</a> · <a href="#" data-m="forgot">Forgot password</a></p>`,
    signup:`<h2>Request access</h2><p class="muted" style="margin:0">Create your account. An admin approves it before you can see records. The very first account becomes the admin.</p>${f('l_name','Full name','text','name')}${f('l_user','Work email','email','username')}${f('l_pass','Password (8+ characters)','password','new-password')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Create account</button><p class="muted" style="margin:0;font-size:13px"><a href="#" data-m="signin">Back to sign in</a></p>`,
    forgot:`<h2>Reset password</h2><p class="muted" style="margin:0">We'll email you a link to set a new password.</p>${f('l_user','Email','email','username')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Send reset link</button><p class="muted" style="margin:0;font-size:13px"><a href="#" data-m="signin">Back to sign in</a></p>`,
    newpw:`<h2>Set a new password</h2>${f('l_pass','New password (8+ characters)','password','new-password')}<div class="err" id="lerr" hidden></div><button class="btn pri" type="submit">Save password</button>`}[mode];
  authCard(`<form id="lf" novalidate style="display:flex;flex-direction:column;gap:14px">${body}</form>`);
  $$('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();showLogin(a.dataset.m)});
  $('#lf').onsubmit=async e=>{e.preventDefault();const er=$('#lerr');er.hidden=true;const v=id=>($('#'+id)||{}).value||'';
    try{
      if(mode==='signin'){await api('POST','/api/login',{username:v('l_user'),password:v('l_pass')});start()}
      else if(mode==='signup'){if(!v('l_name').trim())throw ERR('Enter your full name.',400);const r=await api('POST','/api/signup',{name:v('l_name'),email:v('l_user'),password:v('l_pass')});
        if(r.session)start();else authCard(`<h2>Check your email</h2><p style="margin:0">Open the confirmation link sent to <b>${esc(v('l_user'))}</b>, then come back and sign in. An admin then approves your access.</p><button class="btn" id="back">Back to sign in</button>`),$('#back').onclick=()=>showLogin()}
      else if(mode==='forgot'){await api('POST','/api/forgot',{email:v('l_user')});authCard(`<h2>Check your email</h2><p style="margin:0">If <b>${esc(v('l_user'))}</b> has an account, a reset link is on its way.</p><button class="btn" id="back">Back to sign in</button>`);$('#back').onclick=()=>showLogin()}
      else if(mode==='newpw'){await api('POST','/api/password',{next:v('l_pass')});history.replaceState(null,'',location.pathname);toast('Password saved');start()}
    }catch(x){er.textContent=x.message;er.hidden=false}};
  const first=$('#lf input');if(first)first.focus();
}
function renderMe(){
  const me=S.me;const ini=me.name.split(/\s+/).map(s=>s[0]).join('').slice(0,2).toUpperCase();
  $('#me').innerHTML=`<button type="button" id="meb" aria-haspopup="true"><span class="av">${esc(ini)}</span><span>${esc(me.name)}</span></button><div class="pop" id="mep" hidden><div class="muted" style="padding:6px 10px;font-size:12px">${esc(me.username)} · ${esc(me.role)}</div><button type="button" id="mpw">Change password</button><button type="button" id="mout">Sign out</button></div>`;
  $('#meb').onclick=e=>{e.stopPropagation();$('#mep').hidden=!$('#mep').hidden};
  document.addEventListener('click',()=>{const p=$('#mep');if(p)p.hidden=true});
  $('#mout').onclick=async()=>{await api('POST','/api/logout');location.reload()};
  $('#mpw').onclick=()=>{const fields=[{k:'current',label:'Current password',req:true},{k:'next',label:'New password (8+ characters)',req:true}];
    const sh=formSheet({title:'Change password',fields,onSave:async v=>{try{await api('POST','/api/password',v);toast('Password changed')}catch(e){return e.message}}});$$('input',sh).forEach(i=>i.type='password')};
}
function applySettings(){const d=S.config.settings||{};S.settings=normSettings(d)}

/* ---------- sync with Supabase (every 10 s while the app is open) ---------- */
let syncing=false,syncT=null;
async function sync(){
  if(syncing||!S.me)return;syncing=true;
  try{
    const r=await api('GET','/api/sync?since='+S.seq);
    if(r.full)COLLS.concat('config').forEach(c=>S[c]={});
    r.docs.forEach(d=>{(S[d.coll]||(S[d.coll]={}))[d.id]=d.data});
    (r.deleted||[]).forEach(d=>{if(S[d.coll])delete S[d.coll][d.id]});
    const changed=r.docs.length||(r.deleted||[]).length;S.seq=r.seq;
    if(r.full||r.docs.some(d=>d.coll==='config'))applySettings();
    if(!S.ready){S.ready=true;renderShell();routeHash()}
    else if(changed){const ae=document.activeElement;if(!(S.view==='settings'&&ae&&ae.tagName==='TEXTAREA'))renderList();if(!$('.sheet'))renderDetail()}
    $('#offline')?.remove();
  }catch(e){if(e.code==='offline'&&!$('#offline'))document.body.insertAdjacentHTML('beforeend','<div id="offline" class="toast">No internet connection. Changes can’t be saved until it is back.</div>')}
  finally{syncing=false}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});

async function start(){
  if(!sbClient()){authCard(`<h2>Not connected yet</h2><p style="margin:0">This copy of GFB Asset &amp; Maintenance has no database settings. Open <span class="mono">config.js</span> and paste your Supabase project URL and anon key, as described in the setup guide.</p>`);return}
  if(/type=recovery/.test(location.hash)){showLogin('newpw');return}
  let st;try{st=await api('GET','/api/status')}catch(e){authCard(`<h2>Can’t reach the database</h2><p style="margin:0">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button>`);return}
  if(!st.user){showLogin();return}
  if(!st.user.active){authCard(`<h2>Waiting for approval</h2><p style="margin:0">You're signed in as <b>${esc(st.user.username)}</b>. An admin needs to approve your account before you can see records. Ask them to open <b>Users</b> and activate you.</p><div class="acts"><button class="btn pri" onclick="location.reload()">Check again</button><button class="btn" id="so">Sign out</button></div>`);$('#so').onclick=async()=>{await api('POST','/api/logout');location.reload()};return}
  S.me=st.user;S.canWrite=['admin','editor'].includes(st.user.role);S.canAdmin=st.user.role==='admin';
  VIEWS=ALLVIEWS.filter(v=>(v[0]!=='users'||S.canAdmin)&&(v[0]!=='incidents'||S.me.incidents));
  try{const v=localStorage.getItem('gfb_view');if(v&&VIEWS.some(x=>x[0]===v))S.view=v}catch(e){}
  renderMe();S.ready=false;S.seq=0;await sync();
  clearInterval(syncT);syncT=setInterval(()=>{if(document.visibilityState==='visible')sync()},10000);
}
if(sbClient())sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')showLogin('newpw')});
start();
</script>
